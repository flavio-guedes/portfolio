  function render() {
    const container = document.getElementById('cards');

    const start = page * pageSize;

    slice.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const scoreClass = item.temp === 'QUENTE' ? 'score-high' : (item.temp === 'MORNO' ? 'score-mid' : 'score-low');
      const msgId = 'msg-' + item.email.replace(/[^a-zA-Z0-9]/g,'');

        <h2>${item.name}</h2>
        <div class="meta">${item.company} · Score ${item.score} · <span class="score ${scoreClass}">${item.temp}</span> <span class="prio">${item.prio}</span></div>

        <div class="actions">
          <a class="btn" href="${item.email}" target="_blank" rel="noopener">Mensagem</a>
          <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('${msgId}').innerText);this.innerText='Copiado'">Copiar texto</button>
        </div>
        <div class="msg" id="${msgId}">${item.next}</div>
      `;
      container.appendChild(card);
    });
    document.getElementById('pageInfo').innerText = `Página ${page + 1} · ${start + 1}-${Math.min(start + pageSize, data.length)}/${data.length}`;
    document.getElementById('prev').disabled = page === 0;
    document.getElementById('next').disabled = start + pageSize >= data.length;
  }
  function changePage(delta) {
    page += delta;
    render();
  }
