<!DOCTYPE html>
<html>
<head>
  <title>Diagnóstico</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #0b1117; color: #f3f4f6; }
    .pass { color: #22c55e; }
    .fail { color: #ef4444; }
    .info { color: #3b82f6; }
  </style>
</head>
<body>
  <h1>Diagnóstico HERMES JOB RADAR</h1>
  <div id="results"></div>

  <script type="module">
    const results = document.getElementById('results');

    function log(text, className = '') {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = text;
      results.appendChild(div);
    }

    async function testModule(path, name) {
      try {
        const mod = await import(path);
        log(`PASS ${name}: ${Object.keys(mod).slice(0, 5).join(', ')}`, 'pass');
        return mod;
      } catch (e) {
        log(`FAIL ${name}: ${e.message}`, 'fail');
        return null;
      }
    }

    log('Iniciando diagnóstico...', 'info');

    try {
      const app = await testModule('./src/services/app.js', 'app.js');
      log('app.js carregado: ' + (app ? 'sim' : 'não'), app ? 'pass' : 'fail');
    } catch (e) {
      log('Erro geral: ' + e.message, 'fail');
    }

    log('Diagnóstico concluído.', 'info');
  </script>
</body>
</html>
