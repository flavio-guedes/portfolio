<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERMES JOB RADAR</title>
  <style>
    :root {
      --bg-0: #04070a;
      --bg-1: #0b1117;
      --bg-2: #111923;
      --bg-3: #172029;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text-0: #f3f4f6;
      --text-1: #cbd5e1;
      --text-2: #7a869a;
      --blue-0: #3b82f6;
      --blue-1: #1d4ed8;
      --blue-2: #0b2a4d;
      --success: #22c55e;
      --warn: #eab308;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --orange: #f97316;
      --radius: 18px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, #0c1a2e, var(--bg-0));
      color: var(--text-0);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      min-height: 100vh;
    }

    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(11, 17, 23, 0.7);
      backdrop-filter: blur(18px);
      padding: 18px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .brand { display: flex; flex-direction: column; gap: 6px; }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
    .brand p { margin: 0; font-size: 11px; color: var(--text-2); }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; cursor: pointer; border: 1px solid transparent;
      background: transparent; color: var(--text-1); font-weight: 500; text-align: left;
    }
    .nav-item:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.04); }
    .nav-item.active { background: var(--blue-2); border-color: var(--blue-0); color: var(--text-0); }

    .quick-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text-1); font-weight: 600; cursor: pointer;
    }
    .btn:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.08); }
    .btn.primary { background: linear-gradient(180deg, rgba(59,130,246,0.18), rgba(59,130,246,0.06)); border-color: rgba(59,130,246,0.45); color: var(--text-0); }
    .btn.ghost { background: transparent; }

    .main { padding: 22px; display: flex; flex-direction: column; gap: 18px; }

    .header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    }
    .header-title h2 { margin: 0; font-size: 22px; }
    .header-title p { margin: 6px 0 0; color: var(--text-2); font-size: 12px; }

    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .stat {
      border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      border-radius: var(--radius); padding: 14px;
    }
    .stat-title { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.1em; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }

    .section { border: 1px solid var(--border); background: rgba(255,255,255,0.02); border-radius: var(--radius); padding: 16px; }
    .section-title { margin: 0 0 10px; font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }

    .filter-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text-1); font-size: 12px; cursor: pointer;
    }
    .pill:hover { border-color: var(--border-hover); }
    .pill.active { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.55); color: var(--text-0); }

    .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .job-card {
      border: 1px solid var(--border); background: rgba(255,255,255,0.02); border-radius: var(--radius); padding: 14px; cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .job-card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .job-card.selected { border-color: rgba(59,130,246,0.65); background: rgba(59,130,246,0.06); }
    .job-top { display: flex; justify-content: space-between; gap: 8px; }
    .job-title { font-weight: 700; font-size: 15px; }
    .job-company { color: var(--text-2); font-size: 13px; margin-top: 2px; }
    .job-match { font-size: 13px; font-weight: 700; }
    .job-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 11px; color: var(--text-1); background: rgba(255,255,255,0.04); }
    .badge.head { border-color: rgba(249,115,22,0.45); color: var(--orange); background: rgba(249,115,22,0.08); }
    .badge.live { border-color: rgba(34,197,94,0.45); color: var(--success); background: rgba(34,197,94,0.08); }
    .job-desc { margin-top: 10px; color: var(--text-2); font-size: 12px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .job-actions { display: flex; gap: 8px; margin-top: 12px; }

    .empty-state { color: var(--text-2); font-size: 13px; padding: 12px; border: 1px dashed var(--border); border-radius: var(--radius); }

    .hunt-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .hunt-overlay.open { display: flex; }
    .hunt-panel { width: min(760px, 100%); border: 1px solid var(--border); background: var(--bg-2); border-radius: var(--radius); padding: 18px; }
    .hunt-log { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .hunt-step { color: var(--text-2); font-size: 12px; }
    .hunt-step.done { color: var(--success); }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(920px, 100%); max-height: 90vh; overflow: auto; border: 1px solid var(--border); background: var(--bg-2); border-radius: var(--radius); padding: 18px; }
    .modal-title { margin: 0 0 10px; }
    .modal-close { float: right; background: transparent; border: 1px solid var(--border); color: var(--text-1); padding: 6px 10px; border-radius: 12px; cursor: pointer; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .detail-block { border: 1px solid var(--border); background: rgba(255,255,255,0.02); border-radius: 14px; padding: 14px; }
    .detail-block h4 { margin: 0 0 6px; color: var(--text-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }

    .manual-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field input, .field textarea, .field select {
      background: rgba(255,255,255,0.04); color: var(--text-0); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font-size: 13px;
    }
    .field textarea { resize: vertical; }

    .progress { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue-0), var(--purple)); }

    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .jobs-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>HERMES JOB RADAR</h1>
        <p>Inteligência para encontrar oportunidades que merecem sua atenção.</p>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="radar">📡 Radar</button>
        <button class="nav-item" data-view="pipeline">📋 Pipeline</button>
        <button class="nav-item" data-view="profile">🎯 Perfil</button>
        <button class="nav-item" data-view="manual">➕ Manual</button>
        <button class="nav-item" data-view="import">📥 Importar</button>
      </nav>
      <div class="quick-actions">
        <button class="btn primary" id="huntBtn">⚡ CAÇAR AGORA</button>
        <button class="btn ghost" id="resetBtn">↺ Reiniciar dados</button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="header">
        <div class="header-title">
          <h2 id="viewTitle">RADAR</h2>
          <p id="viewSub">Coleta automática, classificação, ranking e priorização.</p>
          <p id="runtimeDiagnostics" style="margin:6px 0 0; font-size:12px; color:var(--text-2);">Inicializando...</p>
        </div>
      </div>

      <div id="stats" class="stats"></div>

      <div class="section">
        <div class="section-title">Filtros rápidos</div>
        <div class="filter-pills" id="filterPills"></div>
      </div>

      <div id="contentArea" class="jobs-grid"></div>
    </main>
  </div>

  <div class="hunt-overlay" id="huntOverlay">
    <div class="hunt-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:18px; font-weight:700;">⚡ CAÇAR OPORTUNIDADES</div>
          <div style="color:var(--text-2); font-size:12px;">Fluxo: coletar → normalizar → filtrar → ranquear → radar</div>
        </div>
        <button class="btn ghost" id="closeHunt">Fechar</button>
      </div>
      <div class="progress" style="margin-top:12px;"><span id="huntProgress" style="width:0%; transition:width 0.3s;"></span></div>
      <div class="hunt-log" id="huntLog"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <button class="modal-close" id="closeDetail">Fechar</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="/bundle-app.js"></script>
  <script>
    (function() {
      if (typeof window === 'undefined') return;
      window.__scriptErrors = [];
      window.onerror = function(msg, url, line) {
        window.__scriptErrors.push(String(msg) + ' @ ' + url + ':' + line);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        window.__scriptErrors.push('Unhandled: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)));
      });
    })();
  </script>
</body>
</html>
