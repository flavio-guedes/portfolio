<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links LPs — Prospecção</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0c10;
    color: #e5e7eb;
    padding: 24px;
  }
  h1 { font-size: 18px; margin-bottom: 16px; color: #f3f4f6; }
  .group { margin-bottom: 24px; }
  .group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 10px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #111318;
    border: 1px solid #1f2937;
    margin-bottom: 8px;
  }
  .row input {
    flex: 1;
    background: #0b0c10;
    border: 1px solid #1f2937;
    color: #e5e7eb;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .row button {
    padding: 10px 14px;
    border-radius: 8px;
    border: 0;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .row button:active { transform: translateY(1px); }
  .status {
    font-size: 11px;
    color: #10b981;
    min-width: 70px;
    text-align: right;
    opacity: 0;
    transition: opacity .2s;
  }
  .status.show { opacity: 1; }
</style>
</head>
<body>
  <h1>Links — Landing Pages</h1>

  <div class="group">
    <h2>Serviços Landing</h2>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/servicos-landing/pages/produto-ux-design.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/servicos-landing/pages/design-system.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/servicos-landing/pages/direcao-criativa.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/servicos-landing/pages/estrategia-conteudo.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/servicos-landing/pages/trafego-pago.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/servicos-landing/pages/consultoria.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
  </div>

  <div class="group">
    <h2>Cadastro</h2>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/produto-ux-design.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/design-system.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/direcao-criativa.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/estrategia-conteudo.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/trafego-pago.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/consultoria.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
    <div class="row"><input value="https://flavio-guedes.github.io/portfolio/cadastro/pages/index.html" readonly><button>Copiar</button><span class="status">Copiado</span></div>
  </div>

  <script>
    document.querySelectorAll('.row').forEach(function(row) {
      var input = row.querySelector('input');
      var btn = row.querySelector('button');
      var status = row.querySelector('.status');
      btn.addEventListener('click', function() {
        input.select();
        document.execCommand('copy');
        status.classList.add('show');
        setTimeout(function() { status.classList.remove('show'); }, 1200);
      });
    });
  </script>
</body>
</html>
