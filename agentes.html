<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<meta name="theme-color" content="#02060D">
<title>EPQ Central V10 — Inteligência Operacional</title>
<style>
:root{
  --bg:#02070F;--line:rgba(0,191,255,.16);--hair:rgba(255,255,255,.06);
  --cyan:#00BFFF;--cyan2:#8FE6FF;--title:#F2F9FF;--text:#A9C3DB;--dim:#5F7B97;
  --green:#12C7A0;--amber:#FFB547;--violet:#7C8CFF;--red:#E84C62;--pink:#F06CA1;--teal:#2DD4BF;
  --app-pad:16px;--nav-w:210px;--gap:16px;
  --chat-left:calc(var(--app-pad) + var(--nav-w) + var(--gap) + 4px);
  --chat-right:calc(var(--app-pad) + 12px);
}
@media(max-width:980px){:root{--app-pad:12px;--nav-w:64px;--gap:14px}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);font-size:13.5px;line-height:1.6;
  background:radial-gradient(1100px 640px at 85% -10%,rgba(0,191,255,.14),transparent 62%),
             radial-gradient(850px 520px at -10% 110%,rgba(124,140,255,.12),transparent 62%),var(--bg);position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background-image:url("data:image/svg+xml;utf8,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.05;mix-blend-mode:overlay}
button,input,textarea{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}

.glass,.card,.kpi-c,.att-item,.opp-item,.qchip,.radar-strip,.alert-line,.alert-sub{
  background:linear-gradient(135deg,rgba(14,32,56,.32),rgba(7,18,36,.26));
  backdrop-filter:blur(34px) saturate(175%);-webkit-backdrop-filter:blur(34px) saturate(175%);
  border:1px solid rgba(255,255,255,.05);
  box-shadow:0 8px 34px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.05)}

.app{position:relative;display:grid;grid-template-columns:var(--nav-w) 1fr;gap:var(--gap);height:100vh;padding:var(--app-pad);z-index:1}
aside{display:flex;flex-direction:column;gap:4px;padding:14px 10px;border-radius:20px;min-height:0;overflow-y:auto;scrollbar-width:thin}
aside::-webkit-scrollbar{width:5px}
aside::-webkit-scrollbar-thumb{background:rgba(0,191,255,.15);border-radius:5px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,191,255,.5),rgba(124,140,255,.42));border:1px solid var(--line);color:#DFF6FF;flex-shrink:0}
.brand b{display:block;font-size:12px;letter-spacing:.08em;color:var(--title)}
.brand small{color:var(--dim);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;display:block}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:10px 12px 4px;opacity:.6}
nav button{display:flex;align-items:center;gap:9px;background:none;border:1px solid transparent;color:var(--dim);padding:8px 11px;border-radius:10px;text-align:left;cursor:pointer;transition:.2s;font-size:12.5px;width:100%}
nav button:hover{color:var(--title);background:rgba(0,191,255,.06)}
nav button[aria-current=page]{color:var(--cyan2);font-weight:600;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent);border-color:color-mix(in srgb,var(--c) 34%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 18%,transparent)}
.ic{color:var(--c,var(--cyan));filter:drop-shadow(0 0 4px currentColor);flex-shrink:0}

main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow-y:auto;padding:2px 12px 90px 2px;scrollbar-width:thin}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:rgba(0,191,255,.2);border-radius:8px}

.demo-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:10px;letter-spacing:.06em;color:var(--amber);padding:0 2px}
.radar-strip{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:11px;cursor:pointer;transition:.2s;flex-wrap:wrap;font-size:11.5px}
.radar-strip:hover{border-color:rgba(0,191,255,.3)}
.radar-strip .rlab{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700;flex-shrink:0}
.radar-strip .ritem{display:flex;align-items:center;gap:5px}
.radar-strip .ritem i{width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.radar-strip .ritem b{color:var(--c);font-weight:600}
.radar-strip .rmore{font-size:10px;color:var(--cyan);opacity:.7;margin-left:auto}

.front-head{display:flex;flex-direction:column;gap:2px;padding:0 2px}
.front-head .fname{font-size:20px;font-weight:700;color:var(--title);letter-spacing:-.01em;line-height:1.2}
.front-head .fpurp{color:var(--dim);font-size:12px}

.kpis-c{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi-c{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;border-left:2px solid var(--c);cursor:pointer;transition:.2s;text-align:left;width:100%}
.kpi-c:hover{transform:translateY(-1px)}
.kpi-c .kcol{display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi-c .kl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;white-space:nowrap}
.kpi-c .kv{font-size:20px;font-weight:700;color:var(--c);line-height:1.05}
.kpi-c .ka{font-size:10px;color:var(--c);opacity:.7;white-space:nowrap}

.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px}
.sec h2{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);margin:0;display:flex;align-items:center;gap:10px;flex:1}
.sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.sec .sec-action{font-size:10px;color:var(--cyan);opacity:.7;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px}
.sec .sec-action:hover{opacity:1;background:rgba(0,191,255,.08)}
.block{display:flex;flex-direction:column;min-width:0}

/* ===== ALERT LINE com dropdown ===== */
.alert-line{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;margin-bottom:5px;overflow:hidden;transition:.2s;cursor:pointer;border-left:2px solid var(--c)}
.alert-line:hover{transform:translateY(-1px)}
.alert-line .al-badge{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;padding:2px 8px;white-space:nowrap;background:color-mix(in srgb,var(--c) 10%,transparent);flex-shrink:0}
.alert-line .al-title{color:var(--title);font-weight:600;font-size:12.5px;white-space:nowrap;flex-shrink:0;max-width:32%;overflow:hidden;text-overflow:ellipsis}
.alert-line .al-inline{display:flex;gap:8px;flex:1;min-width:0;overflow:hidden;color:var(--dim);font-size:11px}
.alert-line .al-inline .item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.18);border-radius:5px;padding:1px 7px;font-size:10.5px}
.alert-line .al-inline .item b{color:var(--cyan2);font-weight:600}
.alert-line .al-toggle{font-size:10px;color:var(--cyan);flex-shrink:0;padding:2px 6px;border-radius:5px;background:rgba(0,191,255,.08);white-space:nowrap}
.alert-line .al-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.alert-line .al-actions .btn{padding:3px 9px;font-size:10.5px;border-radius:7px}

.alert-sub{padding:6px 12px 10px 24px;border-radius:0 0 11px 11px;margin:-8px 0 5px;border-left:2px solid var(--c);border-top:none;background:linear-gradient(180deg,rgba(14,32,56,.22),rgba(7,18,36,.16))}
.alert-sub .as-line{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:11.5px;border-bottom:1px dashed var(--hair);color:var(--dim)}
.alert-sub .as-line:last-child{border-bottom:none}
.alert-sub .as-line b{color:var(--title);font-weight:600;min-width:130px}
.alert-sub .as-line .as-meta{color:var(--dim);flex:1}
.alert-sub .as-line .btn{padding:2px 8px;font-size:10px;border-radius:6px}
.alert-sub .as-more{font-size:10.5px;color:var(--cyan);padding:6px 0;cursor:pointer;opacity:.75}
.alert-sub .as-more:hover{opacity:1}

/* ===== FUNIL SEM DASH ===== */
.funnel-row{display:grid;grid-template-columns:140px 1fr 36px;gap:12px;align-items:center;padding:5px 0;font-size:12px}
.funnel-row span:first-child{color:var(--text)}
.funnel-row .fbar{height:5px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden}
.funnel-row .fbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.funnel-row .fcount{color:var(--cyan2);font-weight:700;text-align:right;font-size:13px}

/* ===== REC CHIPS ===== */
.rec-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid;background:rgba(0,0,0,.22)}
.rec-chip.abrir{color:#12C7A0;border-color:rgba(18,199,160,.5);background:rgba(18,199,160,.14)}
.rec-chip.testar{color:#00BFFF;border-color:rgba(0,191,255,.5);background:rgba(0,191,255,.14)}
.rec-chip.aguardar{color:#FFB547;border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.14)}
.rec-chip.descartar{color:#E84C62;border-color:rgba(232,76,98,.5);background:rgba(232,76,98,.14)}
.rec-chip.conf{color:#F2F9FF;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.055)}
.rec-chip.conf b{color:#00BFFF;font-weight:700;margin-left:2px}

/* ===== OPORTUNIDADE ===== */
.opp-item{--c:#12C7A0;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;margin-bottom:5px;border-left:2px solid var(--c)}
.opp-item .otitle{color:var(--title);font-weight:600;font-size:12.5px;white-space:nowrap;flex-shrink:0;max-width:38%;overflow:hidden;text-overflow:ellipsis}
.opp-item .obody{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.opp-item .oactions{display:flex;gap:4px;margin-left:auto}
.opp-item .oactions .btn{padding:3px 9px;font-size:10.5px;border-radius:7px}

.qwrap{display:flex;flex-direction:column;gap:8px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:11.5px;color:var(--text);cursor:pointer;transition:.2s;border:1px solid var(--line);text-align:left;line-height:1.4}
.qchip::before{content:"›";color:var(--cyan);font-weight:700;font-size:13px}
.qchip:hover{color:var(--cyan2);border-color:var(--cyan);transform:translateY(-1px)}

.btn{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:10.5px;cursor:pointer;transition:.2s;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--cyan);color:var(--cyan2)}
.btn.p{background:linear-gradient(90deg,#00BFFF,#7C8CFF);color:#031120;border:none;font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--dim);padding:3px 8px}
.btn.ghost:hover{color:var(--cyan2);background:rgba(0,191,255,.06)}
.btn.acc{background:rgba(0,191,255,.09);border-color:rgba(0,191,255,.28);color:var(--cyan2)}
.btn.acc:hover{background:rgba(0,191,255,.18)}

.empty{text-align:center;color:var(--dim);padding:20px 16px;border:1px dashed var(--line);border-radius:11px;font-size:12px}

/* ===== CHAT ===== */
#chat{position:fixed;left:var(--chat-left);right:var(--chat-right);bottom:14px;height:58px;z-index:40;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;
  border:1px solid rgba(0,191,255,.28);background:linear-gradient(180deg,rgba(10,26,48,.72),rgba(8,20,38,.72));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 14px 44px rgba(0,0,0,.42);
  transition:height .4s cubic-bezier(.2,.8,.2,1)}
#chat.open{height:min(88vh,820px)}
#chat .chead{display:none;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--hair)}
#chat.open .chead{display:flex}
.ct{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan2)}
.ct small{font-size:10px;color:var(--dim);letter-spacing:.08em;font-weight:500;text-transform:none}
.sp{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
#chat .log{display:none;flex:1;min-height:0;overflow-y:auto;padding:16px 20px;flex-direction:column;gap:11px}
#chat.open .log{display:flex}
#chat .log::-webkit-scrollbar{width:7px}
#chat .log::-webkit-scrollbar-thumb{background:rgba(0,191,255,.2);border-radius:7px}
#chat .bar2{display:flex;gap:10px;align-items:center;height:58px;padding:10px 12px 10px 16px}
#chat.open .bar2{border-top:1px solid var(--hair)}
#chat .bar2 input{flex:1;padding:10px 14px;border-radius:11px;background:rgba(0,0,0,.32);border:1px solid var(--line);color:var(--title);font-size:12.5px}
#chat .bar2 input::placeholder{color:var(--dim)}

.bub{max-width:88%;padding:12px 16px;border-radius:14px;font-size:12.5px;line-height:1.65;animation:rise .3s ease both}
.bub.u{align-self:flex-end;background:rgba(0,191,255,.16);border:1px solid rgba(0,191,255,.28);color:#E2F3FF}
.bub.b{align-self:flex-start;background:rgba(124,140,255,.12);border:1px solid rgba(124,140,255,.3);color:#E6DEFF}
.bub h4{margin:9px 0 4px;color:var(--cyan2);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.bub h4:first-child{margin-top:0}
.bub p{margin:0 0 6px}
.bub ul{margin:0;padding-left:16px}
.bub li{margin-bottom:2px}
.bub b{color:#F2F9FF;font-weight:600}
.bub .bnote{color:var(--dim);font-size:10px;font-style:italic;margin-top:6px;display:block}
.followups{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.08)}
.followups .flab{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:6px}
.followups .fgrid{display:flex;flex-wrap:wrap;gap:5px}
.followups button{background:rgba(0,191,255,.08);border:1px solid rgba(0,191,255,.24);color:var(--cyan2);border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;text-align:left;line-height:1.3}
.followups button:hover{background:rgba(0,191,255,.16)}

.records-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.records-head h2{font-size:18px;color:var(--title);margin:0;font-weight:700}
.records-head p{margin:0;color:var(--dim);font-size:12px}
.records-table{width:100%;border-collapse:collapse;font-size:11.5px}
.records-table th{color:var(--dim);font-weight:600;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:7px 9px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(7,26,48,.72);backdrop-filter:blur(8px);cursor:pointer;white-space:nowrap}
.records-table td{padding:8px 9px;border-bottom:1px solid var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.records-table tbody tr{cursor:pointer;transition:.15s}
.records-table tbody tr:hover{background:rgba(0,191,255,.05)}
.records-table tbody tr.sel{background:rgba(0,191,255,.12);box-shadow:inset 2px 0 0 var(--cyan)}
.records-table td b{color:var(--title);font-weight:600}
.record-detail{display:flex;flex-direction:column;gap:11px;padding:14px 16px;border-radius:13px;background:rgba(255,255,255,.02);border:1px solid var(--hair)}
.record-detail h3{margin:0;font-size:14.5px;color:var(--title);font-weight:700}
.record-detail .rd-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.record-detail .rd-grid>div{background:rgba(0,0,0,.2);border:1px solid var(--hair);border-radius:8px;padding:7px 9px}
.record-detail .rd-grid span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block}
.record-detail .rd-grid b{display:block;color:var(--cyan2);font-size:12px;margin-top:3px;font-weight:600}
.record-detail .rd-acts{display:flex;gap:5px;flex-wrap:wrap}

@media(max-width:980px){
  .brand b,.brand small,nav .lbl,nav .grp{display:none}
  .brand{justify-content:center;padding:4px 0 12px}
  nav button{justify-content:center;padding:9px 0}
  .kpis-c{grid-template-columns:1fr}
  .kpi-c .ka{display:none}
  .alert-line .al-inline{display:none}
}
@media(max-width:520px){
  .alert-line{flex-wrap:wrap}
  .alert-line .al-title{max-width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rise{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =====================================================================
   EPQ · DIREÇÃO VISUAL "CENTRAL DE OPERAÇÕES TÁTICAS"
   Camada aplicada sobre o CSS funcional acima. Nada daqui altera
   dados, rotas ou interações — apenas acabamento.
   Ajuste a atmosfera pelas variáveis em :root (bloco "controles").
   ===================================================================== */
:root{
  /* paleta */
  --bg:#02060D;
  --blue:#2B7BFF;            /* azul elétrico */
  --cyan:#00BFFF;
  --alert:#E84C62;           /* vermelho: alertas */
  --warn:#FFB547;            /* âmbar: atenção */
  /* superfícies (glass) */
  --glass-a:rgba(11,26,50,.60);
  --glass-b:rgba(5,14,30,.52);
  --edge:rgba(125,178,255,.13);
  --edge-hi:rgba(150,208,255,.55);
  --blur:14px;
  /* controles de atmosfera */
  --glow:.55;                /* intensidade geral dos brilhos (0–1) */
  --scene-dim:.86;           /* opacidade da cena ao fundo */
  --pulse-slow:7.5s;         /* respiração das bordas e barra de luz */
  --pulse-mid:5.2s;          /* alternância azul/vermelho da viatura */
  --pulse-fast:2.8s;         /* indicadores vivos */
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --ui-zoom:.85;             /* escala geral da interface */
}

body{
  font-family:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(900px 560px at 88% 6%,rgba(30,100,255,.10),transparent 60%),
    radial-gradient(760px 520px at 0% 100%,rgba(0,191,255,.06),transparent 60%),
    var(--bg);
}
body::after{opacity:.035;mix-blend-mode:normal}

/* ---------- CENA DE FUNDO (camadas com paralaxe) ---------- */
.bg{--px:0;--py:0;--sy:0;position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:layout paint}
.bg>*{position:absolute;will-change:transform}

  opacity:var(--scene-dim);
  transform:translate3d(calc(var(--px)*-12px),calc(var(--py)*-5px + var(--sy)*-.02px),0);
}
.bg-grid{
  inset:-2%;opacity:.55;
  background-image:
    linear-gradient(rgba(96,156,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(96,156,255,.04) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 85% at 22% 40%,#000,transparent 78%);
          mask-image:radial-gradient(70% 85% at 22% 40%,#000,transparent 78%);
  transform:translate3d(calc(var(--px)*7px),calc(var(--py)*4px + var(--sy)*-.012px),0);
}
/* riscos de luz diagonais, canto superior esquerdo */
.bg-streak{left:0;top:0;width:44vw;height:56vh;opacity:calc(.3 + var(--glow)*.55);
  background:
    linear-gradient(118deg,transparent 0 30%,rgba(26,92,255,.22) 30.2%,rgba(26,92,255,.07) 47%,transparent 47.2%),
    linear-gradient(118deg,transparent 0 12%,rgba(70,150,255,.15) 12.2%,transparent 25%);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 88%);mask-image:linear-gradient(180deg,#000,transparent 88%);
  transform:translate3d(calc(var(--px)*10px),calc(var(--py)*6px),0)}
.bg-streak::after{content:"";position:absolute;left:0;top:30%;width:48%;height:1px;
  background:linear-gradient(90deg,rgba(232,60,90,.75),transparent);animation:edge-breathe var(--pulse-mid) ease-in-out infinite}
/* luzes da viatura: azul e vermelho alternando, lentas */
.bg-glow{border-radius:50%;opacity:.6}
.bg-glow--blue{
  width:44vw;height:30vh;left:50%;top:5%;
  background:radial-gradient(closest-side,rgba(32,112,255,.5),rgba(32,112,255,.16) 55%,transparent);
  animation:beacon-b var(--pulse-mid) ease-in-out infinite;
  transform:translate3d(calc(var(--px)*-20px),calc(var(--py)*-10px),0);
}
.bg-glow--red{
  width:30vw;height:26vh;left:70%;top:8%;
  background:radial-gradient(closest-side,rgba(232,56,88,.42),rgba(232,56,88,.12) 55%,transparent);
  animation:beacon-r var(--pulse-mid) ease-in-out infinite;
  transform:translate3d(calc(var(--px)*-24px),calc(var(--py)*-12px),0);
}
.bg-glow--road{
  width:36vw;height:22vh;left:58%;bottom:-6%;
  background:radial-gradient(closest-side,rgba(60,120,255,.34),rgba(232,56,88,.14) 55%,transparent);
  animation:beacon-b calc(var(--pulse-mid)*1.4) ease-in-out infinite reverse;
  transform:translate3d(calc(var(--px)*-16px),calc(var(--py)*-6px),0);
}
@keyframes beacon-b{0%,100%{opacity:calc(var(--glow)*1.25)}50%{opacity:calc(var(--glow)*.38)}}
@keyframes beacon-r{0%,100%{opacity:calc(var(--glow)*.3)}50%{opacity:calc(var(--glow)*1.2)}}

/* pontos de luz desfocados (bokeh) */
.bg-bokeh{inset:0;transform:translate3d(calc(var(--px)*-26px),calc(var(--py)*-14px + var(--sy)*-.045px),0)}
.bg-bokeh i{
  position:absolute;border-radius:50%;opacity:.2;
  background:radial-gradient(circle,var(--k),transparent 68%);
  animation:bokeh var(--d,11s) ease-in-out infinite;animation-delay:var(--w,0s);
}
.bg-bokeh i:nth-child(1){left:62%;top:22%;width:34px;height:34px;--k:rgba(190,215,255,.9);--d:12s}
.bg-bokeh i:nth-child(2){left:71%;top:31%;width:22px;height:22px;--k:rgba(60,130,255,.95);--d:9s;--w:-3s}
.bg-bokeh i:nth-child(3){left:57%;top:37%;width:18px;height:18px;--k:rgba(0,191,255,.9);--d:13s;--w:-6s}
.bg-bokeh i:nth-child(4){left:78%;top:13%;width:26px;height:26px;--k:rgba(240,70,95,.8);--d:10s;--w:-2s}
.bg-bokeh i:nth-child(5){left:66%;top:66%;width:30px;height:30px;--k:rgba(240,70,95,.7);--d:14s;--w:-8s}
.bg-bokeh i:nth-child(6){left:53%;top:60%;width:24px;height:24px;--k:rgba(60,130,255,.9);--d:11s;--w:-5s}
@keyframes bokeh{
  0%,100%{opacity:.14;transform:translate3d(0,0,0) scale(1)}
  50%{opacity:calc(.22 + var(--glow)*.4);transform:translate3d(6px,-9px,0) scale(1.16)}
}
/* escurece a esquerda (área de dados) e vinheta */
.bg-shade{
  inset:0;will-change:auto;
  background:
    linear-gradient(90deg,rgba(2,6,13,.95) 0%,rgba(2,6,13,.76) 36%,rgba(2,6,13,.40) 76%,rgba(2,6,13,.24) 100%),
    radial-gradient(120% 90% at 55% 45%,transparent 55%,rgba(0,0,0,.6) 100%);
}

/* barra de luz operacional no topo */
.lightbar{position:fixed;left:0;right:0;top:0;height:2px;z-index:60;pointer-events:none;
  background:linear-gradient(90deg,transparent 0,#1E6BFF 12%,#00BFFF 30%,transparent 46%,transparent 54%,#E84C62 70%,#FF6F82 88%,transparent 100%);
  opacity:calc(.35 + var(--glow)*.55);animation:bar-breathe var(--pulse-slow) ease-in-out infinite}
.lightbar::after{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:inherit;opacity:.16;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.lightbar::before{content:"";position:absolute;top:0;left:0;width:18vw;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  animation:bar-scan 15s linear infinite}
@keyframes bar-breathe{0%,100%{opacity:calc(.3 + var(--glow)*.62)}50%{opacity:calc(.2 + var(--glow)*.3)}}
@keyframes bar-scan{from{transform:translateX(-20vw)}to{transform:translateX(105vw)}}

/* ---------- SUPERFÍCIES: glass discreto, bordas finas, profundidade ---------- */
.glass,.card,.kpi-c,.att-item,.opp-item,.qchip,.radar-strip,.alert-line,.alert-sub{
  background:linear-gradient(145deg,var(--glass-a),var(--glass-b));
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border-color:var(--edge);
  box-shadow:0 14px 34px -16px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,255,255,.045);
}
.kpi-c,.alert-line,.opp-item,.alert-sub{border-left-color:var(--c)}
.qchip,.alert-sub{backdrop-filter:none;-webkit-backdrop-filter:none}
.qchip{border-color:rgba(0,191,255,.2);background:rgba(9,22,42,.72)}
.alert-sub{background:linear-gradient(180deg,rgba(10,24,46,.7),rgba(5,14,30,.66))}
.alert-line{box-shadow:0 14px 34px -16px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,255,255,.045),inset 20px 0 26px -24px color-mix(in srgb,var(--c) 70%,transparent)}
.kpi-c{box-shadow:0 14px 34px -16px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,255,255,.045),inset 22px 0 28px -26px color-mix(in srgb,var(--c) 70%,transparent)}

aside.glass,.kpi-c,.alert-line,.opp-item,.radar-strip,.card{position:relative;isolation:isolate}

/* reflexo luminoso na borda superior (respira, desfasado entre painéis) */
aside.glass::after,.kpi-c::after,.alert-line::after,.opp-item::after,.radar-strip::after,.card::after,#chat::after{
  content:"";position:absolute;left:8%;right:8%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--edge-hi),transparent);
  opacity:calc(var(--glow)*1.1);
  animation:edge-breathe var(--pulse-slow) ease-in-out infinite;animation-delay:var(--dly,0s);
}
.kpis-c .kpi-c:nth-child(2),.opp-item:nth-of-type(2){--dly:-2.6s}
.kpis-c .kpi-c:nth-child(3),.alert-line{--dly:-5s}
.radar-strip{--dly:-1.4s}
@keyframes edge-breathe{0%,100%{opacity:calc(var(--glow)*1.15)}50%{opacity:calc(var(--glow)*.35)}}

/* luz que acompanha o cursor, só no contorno do painel */
aside.glass::before,.kpi-c::before,.alert-line::before,.opp-item::before,.radar-strip::before,.card::before,#chat::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:radial-gradient(170px circle at var(--mx,50%) var(--my,0%),rgba(130,205,255,.8),transparent 65%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
          mask-composite:exclude;
  opacity:0;transition:opacity .35s ease;
}
aside.glass:hover::before,.kpi-c:hover::before,.alert-line:hover::before,.opp-item:hover::before,.radar-strip:hover::before,.card:hover::before,#chat:hover::before{opacity:1}
@media(hover:none){aside.glass::before,.kpi-c::before,.alert-line::before,.opp-item::before,.radar-strip::before,.card::before,#chat::before{display:none}}

/* ---------- LOGO (topo, canto esquerdo) ---------- */
.brand{flex-direction:column;align-items:stretch;gap:11px;padding:2px 2px 14px}
.brand-logo{position:relative;display:block;border-radius:12px;overflow:hidden;line-height:0;isolation:isolate;
  border:1px solid rgba(130,185,255,.3);
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 12px 30px -14px rgba(32,112,255,calc(var(--glow)*1.1))}
.brand-logo img{display:block;width:100%;height:auto;filter:saturate(.94) brightness(.95)}
.brand-logo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);
  transform:translateX(-130%);animation:sheen 10s ease-in-out infinite}
@keyframes sheen{0%,68%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.brand-txt{padding:0 6px}
.brand b{font-size:12px;letter-spacing:.1em}
.brand small{display:flex;align-items:center;gap:7px;margin-top:3px}
.brand small::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse var(--pulse-fast) ease-in-out infinite}

/* ---------- NAVEGAÇÃO + ÍCONES ANIMADOS ---------- */
nav button{position:relative}
nav button[aria-current=page]{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),transparent 85%)}
nav button[aria-current=page]::before{content:"";position:absolute;left:-1px;top:20%;bottom:20%;width:2px;border-radius:2px;
  background:var(--c);box-shadow:0 0 10px var(--c)}
nav button .ic{transition:transform .4s var(--ease-out),filter .3s}
nav button:hover .ic{transform:translateY(-1px) scale(1.12)}
nav button[aria-current=page] .ic{animation:icon-glow 4.6s ease-in-out infinite}
@keyframes icon-glow{0%,100%{filter:drop-shadow(0 0 3px currentColor)}50%{filter:drop-shadow(0 0 8px currentColor)}}
/* Principal · o check do escudo se desenha */
nav button[data-r=principal] .ic path:nth-child(2){stroke-dasharray:10;animation:draw-check 6.5s ease-in-out infinite}
@keyframes draw-check{0%{stroke-dashoffset:10}14%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:10}}
/* Sucesso · traço de batimento */
nav button[data-r=cs] .ic path{stroke-dasharray:42;animation:ecg 3.8s ease-in-out infinite}
@keyframes ecg{0%{stroke-dashoffset:42}38%,76%{stroke-dashoffset:0}100%{stroke-dashoffset:-42}}
/* Comercial · mira gira ao focar */
nav button[data-r=comercial]:hover .ic,nav button[data-r=comercial][aria-current=page] .ic{transform:rotate(90deg) scale(1.08)}
nav button[data-r=comercial] .ic{transition:transform .7s var(--ease-out),filter .3s}
/* Turmas · agulha da bússola oscila */
nav button[data-r=turmas] .ic path:nth-child(2){transform-box:fill-box;transform-origin:center}
nav button[data-r=turmas]:hover .ic path:nth-child(2),nav button[data-r=turmas][aria-current=page] .ic path:nth-child(2){animation:needle 3.6s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(18deg)}}
/* Marketing · raio cintila */
nav button[data-r=marketing]:hover .ic,nav button[data-r=marketing][aria-current=page] .ic{animation:flick 2.4s linear infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.45}50%{opacity:1}54%{opacity:.6}56%{opacity:1}}
/* TI · terminais do chip piscam */
nav button[data-r=ti]:hover .ic path,nav button[data-r=ti][aria-current=page] .ic path{animation:pins 2.8s ease-in-out infinite}
@keyframes pins{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- TIPOGRAFIA E INDICADORES ---------- */
.front-head .fname{font-size:24px;letter-spacing:-.02em;font-weight:700}
.front-head .fpurp{font-size:12.5px}
.demo-line span:first-child{display:flex;align-items:center;gap:8px}
.demo-line span:first-child::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse var(--pulse-fast) ease-in-out infinite}
.kpi-c{padding:12px 16px}
.kpi-c .kv{font-size:27px;letter-spacing:-.02em;text-shadow:0 0 22px color-mix(in srgb,var(--c) calc(var(--glow)*60%),transparent)}
.kpi-c .ka{transition:transform .3s var(--ease-out),opacity .3s}
.kpi-c:hover .ka{transform:translateX(3px);opacity:1}
.kpi-c:hover,.alert-line:hover{transform:translateY(-1px)}
.sec h2{letter-spacing:.14em}
/* radar: pontos "vivos" com ondas */
.radar-strip .ritem i{position:relative}
.radar-strip .ritem i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--c);opacity:0;animation:ping 3.2s ease-out infinite}
.radar-strip .ritem:nth-of-type(2) i::after{animation-delay:-1.4s}
@keyframes ping{0%{transform:scale(.5);opacity:.8}70%,100%{transform:scale(2.6);opacity:0}}
/* badge de prioridade respira */
.alert-line .al-badge{animation:badge-glow 3.6s ease-in-out infinite}
@keyframes badge-glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 14px -2px color-mix(in srgb,var(--c) calc(var(--glow)*70%),transparent)}}

/* ---------- BOTÕES E CAMPOS ---------- */
.btn{transition:border-color .2s,color .2s,box-shadow .25s,background .2s}
.btn:hover{box-shadow:0 0 16px -5px rgba(0,191,255,.55)}
.btn.acc{background:linear-gradient(180deg,rgba(0,191,255,.12),rgba(0,191,255,.06));border-color:rgba(0,191,255,.3)}
.btn.p{background:linear-gradient(90deg,#17C3FF,#4B8CFF);color:#021024;box-shadow:0 6px 18px -8px rgba(43,123,255,.8)}
.btn.p:hover{box-shadow:0 8px 24px -6px rgba(43,123,255,.95)}
.qchip{transition:color .2s,border-color .2s,transform .25s var(--ease-out),box-shadow .25s}
.qchip:hover{box-shadow:0 0 18px -6px rgba(0,191,255,.55)}

/* ---------- ASSISTENTE (base) ---------- */
#chat{border-color:rgba(70,150,255,.3);
  background:linear-gradient(180deg,rgba(11,28,54,.74),rgba(6,16,34,.78));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 18px 50px -14px rgba(0,0,0,.75),0 0 38px -12px rgba(43,123,255,calc(var(--glow)*.7))}
#chat .bar2 input{background:rgba(0,0,0,.34);transition:border-color .2s,box-shadow .25s}
#chat .bar2 input:focus{outline:none;border-color:rgba(0,191,255,.55);box-shadow:0 0 0 3px rgba(0,191,255,.12)}
.bub.b{background:rgba(43,123,255,.1);border-color:rgba(90,155,255,.28);color:#DDE9FF}
.followups button{transition:background .2s,box-shadow .25s}
.followups button:hover{box-shadow:0 0 14px -5px rgba(0,191,255,.5)}

/* ---------- ENTRADA ORQUESTRADA (só ao trocar de tela) ---------- */
@keyframes enter-up{from{transform:translateY(10px)}to{transform:none}}
@keyframes enter-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main.enter>*{animation:enter-up .55s var(--ease-out) backwards;animation-delay:calc(var(--i,0)*45ms)}
main.enter>*:nth-child(1){--i:0}main.enter>*:nth-child(2){--i:1}main.enter>*:nth-child(3){--i:2}
main.enter>*:nth-child(4){--i:3}main.enter>*:nth-child(5){--i:4}main.enter>*:nth-child(6){--i:5}
main.enter>*:nth-child(7){--i:6}main.enter>*:nth-child(8){--i:7}main.enter>*:nth-child(n+9){--i:8}
main.enter .kpi-c,main.enter .alert-line,main.enter .opp-item,main.enter .qchip{animation:enter-fade .55s var(--ease-out) backwards;animation-delay:calc(160ms + var(--n,0)*60ms)}
main.enter .kpis-c>*:nth-child(2),main.enter .block>*:nth-child(3),main.enter .qchips>*:nth-child(2){--n:1}
main.enter .kpis-c>*:nth-child(3),main.enter .block>*:nth-child(4),main.enter .qchips>*:nth-child(3){--n:2}
main.enter .block>*:nth-child(5),main.enter .qchips>*:nth-child(4){--n:3}
main.enter .block>*:nth-child(n+6),main.enter .qchips>*:nth-child(n+5){--n:4}

/* ---------- RESPONSIVO ---------- */
@media(max-width:980px){
  .brand b,.brand small{display:none}
  .bg-scene{background-position:72% center}
  .brand{padding:2px 0 12px}
  .brand-logo{border-radius:9px}
  .front-head .fname{font-size:21px}
}
@media(max-width:520px){.kpi-c .kv{font-size:24px}}

/* ---------- ACESSIBILIDADE: movimento reduzido ---------- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .bg-glow--blue,.bg-glow--red,.bg-glow--road{opacity:calc(var(--glow)*.7)}
  .bg-bokeh i{opacity:.3}
  .bg>*,.bg-scene{transform:none!important}
}

/* ---------- ESCALA GERAL (−15%) + VINHETA ---------- */
.app{zoom:var(--ui-zoom);height:calc(100vh / var(--ui-zoom))}
#chat{zoom:var(--ui-zoom)}
#chat.open{height:min(calc(88vh / var(--ui-zoom)),820px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:45;
  background:radial-gradient(135% 115% at 50% 45%,transparent 56%,rgba(0,0,0,.45) 100%)}
/* logo reduzido */
.brand-logo{width:62%}
@media(max-width:980px){.brand-logo{width:100%}}

/* ---------- PANORAMA DAS FRENTES (resumos das demais abas) ---------- */
.pan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}
.pan-card{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:7px;padding:10px 13px;text-align:left;font-size:12px}
.pan-card .pc-top{display:flex;align-items:center;gap:8px;color:var(--title);font-weight:600;font-size:12.5px}
.pan-card .pc-top .ka{margin-left:auto;font-size:10px;color:var(--c);opacity:.6}
.pan-card .pc-row{display:flex;align-items:baseline;gap:8px}
.pan-card .kv{font-size:21px}
.pan-card .pc-l{color:var(--dim);font-size:11px}
.pan-card .pc-s{color:var(--text);opacity:.8;font-size:11px;border-top:1px dashed var(--hair);padding-top:6px}
.pan-card .pc-s b{color:var(--c);font-weight:600}
</style>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>{if(!s)return'—';const[d]=String(s).split('T');const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;};
const daysAgo=s=>s?Math.round((new Date(REF)-new Date(s))/864e5):null;
const el=id=>document.getElementById(id);

function save(){/* integração: sem persistência local; o backend é a fonte da verdade */}
function M(key){const list=state.data[key]||[];const edits=state.edits[key]||{};return list.map(x=>Object.assign({},x,edits[x.id]||{}))}
const L=()=>M('leads'),A=()=>M('alunos'),C=()=>M('campanhas'),T=()=>M('turmas'),O=()=>M('ocorrencias'),AL=()=>M('alertas');
const FN=()=>M('financeiro'),FT=()=>M('financeiroContas'),ES=()=>M('estrutura'),RH=()=>M('rh'),RHB=()=>M('rhBeneficios');
const FIL=()=>M('filiais'),TI=()=>M('ti'),AG=()=>M('agenda');
const R=()=>state.data.radar;

function calc(){
  const leads=L(),alunos=A(),camp=C();
  const ativos=x=>x.etapa!=='Perdido'&&x.etapa!=='Matrícula confirmada';
  const leadsAtivos=leads.filter(ativos).length;
  const matriculas=leads.filter(x=>x.etapa==='Matrícula confirmada').length;
  const semRet=leads.filter(x=>ativos(x)&&daysAgo(x.ultimoContato)>1);
  const alunosRisco=alunos.filter(x=>x.risco!=='OK'&&x.situacao!=='resolvido').length;
  const alunosCriticos=alunos.filter(x=>x.risco==='critico'&&x.situacao!=='resolvido').length;
  const invest=camp.reduce((s,x)=>s+x.investimento,0);
  const leadsCamp=camp.reduce((s,x)=>s+x.leads,0);
  const matricCamp=camp.reduce((s,x)=>s+x.matriculas,0);
  const cpl=leadsCamp?invest/leadsCamp:0;
  const investSemMat=camp.filter(x=>x.matriculas===0&&x.investimento>0).reduce((s,x)=>s+x.investimento,0);
  return {leadsAtivos,matriculas,semRet,alunosRisco,alunosCriticos,invest,leadsCamp,matricCamp,cpl,investSemMat};
}

function alertLine({id,level,color,title,count,items,query,frontKey,moreLabel}){
  const expanded=!!state.expanded[id];
  const preview=items.slice(0,3);
  const inlineHTML=preview.map(i=>`<span class="item"><b>${esc(i.label)}</b>${i.meta?' · '+esc(i.meta):''}</span>`).join('');
  const more=items.length-3;
  const expandBtn=items.length>3?`<span class="al-toggle">${expanded?'▲ ocultar':'▼ ver +'+more}</span>`:'';
  const subHTML=expanded?`<div class="alert-sub" style="--c:${color}">
    ${items.map((it,i)=>`<div class="as-line"><b>${esc(it.label)}</b><span class="as-meta">${esc(it.meta||'')}</span>${it.action?`<button class="btn acc" data-ask="${esc(it.action.query)}">${esc(it.action.label)}</button>`:''}</div>`).join('')}
  </div>`:'';
  return `<div class="alert-line" data-alert="${esc(id)}" style="--c:${color}">
    <span class="al-badge">${esc(level)}</span>
    <span class="al-title">${esc(title)}</span>
    ${inlineHTML?`<span class="al-inline">${inlineHTML}</span>`:''}
    ${expandBtn}
    <div class="al-actions">
      <button class="btn acc" data-ask="${esc(query)}">Investigar</button>

function oppLine({title,body,query}){

function kpi(label,value,color,q){return `<button class="kpi-c" data-ask="${esc(q)}" style="--c:${color}"><div class="kcol"><span class="kl">${esc(label)}</span><span class="kv">${value}</span></div><span class="ka">investigar →</span></button>`;}

function qBlock(front,allQ){
  const ex=!!state.qExpanded[front];const sh=ex?allQ:allQ.slice(0,3);const more=allQ.length-3;
  return `<div class="qwrap"><div class="qchips">${sh.map(q=>`<button class="qchip" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}${!ex&&more>0?`<button class="qchip" data-q-toggle="${front}" style="color:var(--dim)">+${more}…</button>`:''}${ex?`<button class="qchip" data-q-toggle="${front}" style="color:var(--dim)">− menos</button>`:''}</div></div>`;
}

function demoLine(){return `<div class="demo-line"><span>${DEMO_TAG}</span><span>Ref: ${dt(REF)}</span></div>`}
function radarStrip(){
  const r=R();const ab=r.find(x=>x.tipo==='aberto');const pv=r.find(x=>x.tipo==='prev');
  const items=[];if(ab)items.push({...ab,c:'#12C7A0',l:'inscrições abertas'});if(pv)items.push({...pv,c:'#FFB547',l:'edital a confirmar'});
  return `<div class="radar-strip" data-radar role="button"><span class="rlab">Radar</span>${items.map(i=>`<span class="ritem" style="--c:${i.c}"><i></i><b>${esc(i.concurso)}</b>: ${esc(i.l)}</span>`).join('')}<span class="rmore">+${r.length-items.length} →</span></div>`;
}

    card('estrutura','tools','Estrutura','#FFB547',es.length,'itens com pendência',`<b>${estPrio}</b> prioritários`),

  var el = document.getElementById('agentes-grid');
  if(!el) return;
  try {
    var r = await fetch('/api/agentes');
    var lista = await r.json();
    var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px">';
    Object.keys(lista).forEach(function(id){ html += _agentCard(lista[id], id); });

/* ============ ABRIR DETALHE ============ */
function abrirAgente(id){
  if(window._pararLiveFeed) window._pararLiveFeed();
  window._agentView = 'detail';
  window._agentAtual = id;
  window._tabAgente = 'skills';
  render();
}
function voltarAgentes(){
  if(window._pararLiveFeed) window._pararLiveFeed();
  window._agentView = 'grid';
  window._agentAtual = null;
  render();
}

async function renderDetalhe(){
  var el = document.getElementById('agente-detalhe');
  if(!el) return;
  try {
    var r = await fetch('/api/agentes');
    var lista = await r.json();
    var a = lista[window._agentAtual];
    if(!a){ voltarAgentes(); return; }
    var icone = ICONES[window._agentAtual] || ICONES.designer;
    var tabs = _tabsDetalhe(a);

    el.innerHTML = ''
      // voltar
      + '<div style="margin-bottom:12px"><button class="btn" onclick="voltarAgentes()">← Voltar</button></div>'
      // header
      + '<div style="display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:14px;'
      + 'background:linear-gradient(160deg,rgba(14,32,56,.55),rgba(7,18,36,.55));'
      + 'border:1px solid rgba(255,255,255,.07);border-top:3px solid ' + a.cor + ';margin-bottom:14px">'
        + '<div style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;'
        + 'background:color-mix(in srgb,' + a.cor + ' 18%,transparent);border:1px solid color-mix(in srgb,' + a.cor + ' 40%,transparent);color:' + a.cor + ';flex-shrink:0">' + icone + '</div>'
        + '<div style="flex:1;min-width:0">'
          + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
            + '<div>'
              + '<div style="color:var(--title);font-weight:700;font-size:18px">' + a.nome + '</div>'
              + '<div style="color:var(--dim);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;font-weight:600">' + a.tipo + ' · ' + a.fonte + '</div>'
            + '</div>'
            + '<span class="badge" style="--c:' + a.cor + '">' + (a.ativo ? 'ON' : 'OFF') + '</span>'
          + '</div>'
          + '<div style="color:var(--text);font-size:12.5px;margin-top:8px;line-height:1.55">' + (a.objetivo || a.descricao) + '</div>'
        + '</div>'
      + '</div>'
      // tabs
      + '<div style="display:flex;gap:4px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px">' + tabs + '</div>'
      + '<div id="tab-conteudo"></div>'
      // barra inferior
      + _barraInferior(a) + '<div id="atividades-live" style="margin-top:16px"></div>';
    _renderTab(a);
    _iniciarLiveFeed(window._agentAtual);
  } catch(e) {
    el.innerHTML = '<div class="empty">Erro ao carregar.</div>';
  }
}

function _tabsDetalhe(a){
  var abas = [
    ['skills','Skills & Ferramentas'],
    ['kanban','Kanban Individual'],
    ['permissoes','Permissões & Autonomia']
  ];
  return abas.map(function(t){
    var ativa = window._tabAgente === t[0];
    return '<button onclick="mudarTabDetalhe(\'' + t[0] + '\')" style="background:none;border:none;color:' + (ativa ? '#00BFFF' : '#5F7B97') + ';font-family:inherit;font-size:12.5px;font-weight:600;padding:12px 16px;cursor:pointer;border-bottom:2px solid ' + (ativa ? '#00BFFF' : 'transparent') + ';margin-bottom:-1px">' + t[1] + '</button>';
  }).join('');
}

function mudarTabDetalhe(tab){
  window._tabAgente = tab;
  renderDetalhe();
}

async function _renderTab(a){
  var box = document.getElementById('tab-conteudo');
  if(!box) return;
  if(window._tabAgente === 'kanban'){ box.innerHTML = _tabKanban(a); return; }
  if(window._tabAgente === 'permissoes'){ box.innerHTML = _tabPermissoes(a); return; }
  box.innerHTML = _tabSkills(a);
}

function _tabSkills(a){
  var col = function(titulo, corBase, itens, tipo){
    return '<div style="flex:1;min-width:220px">'
      + '<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:' + corBase + ';font-weight:700;margin-bottom:10px">' + titulo + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:6px">'
        + itens.map(function(t){
            var ic = _iconePorTexto(t, corBase, tipo);
            return '<div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);'
              + 'border:1px solid rgba(255,255,255,.06);border-left:2px solid ' + ic.cor + ';'
              + 'border-radius:8px;padding:8px 11px">'
              + '<span style="width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;'
              + 'background:color-mix(in srgb,' + ic.cor + ' 16%,transparent);'
              + 'border:1px solid color-mix(in srgb,' + ic.cor + ' 38%,transparent);color:' + ic.cor + '">'
              + ic.svg + '</span>'
              + '<span style="font-size:12px;color:var(--text);line-height:1.3">' + t + '</span>'
            + '</div>';
          }).join('')
      + '</div></div>';
  };
  return '<div style="display:flex;gap:18px;flex-wrap:wrap">'
    + col('Skills', a.cor, a.skills || [], 'skill')
    + col('Ferramentas', '#12C7A0', a.ferramentas || [], 'tool')
    + col('Competências', '#FFB547', a.competencias || [], 'comp')
    + '</div>';
}

/* ============ TAB PERMISSÕES ============ */
function _tabPermissoes(a){
  if(!window._permissoes || window._permissoes._agente !== a.nome){
    window._permissoes = Object.assign({_agente: a.nome}, a.permissoes || {});
    window._autonomia = a.autonomia || 'parcial';
  }
  var nivel = window._autonomia;
  var niveis = ['total','parcial','sem_permissao'].map(function(n){
    var info = AUTONOMIA_INFO[n];
    var ativo = nivel === n;
    return '<button onclick="mudarAutonomia(\'' + n + '\')" style="flex:1;text-align:left;background:' + (ativo ? 'color-mix(in srgb,' + info.cor + ' 18%,transparent)' : 'rgba(255,255,255,.02)') + ';border:1px solid ' + (ativo ? info.cor : 'rgba(255,255,255,.08)') + ';border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--text);font-family:inherit">'
      + '<div style="font-size:11.5px;font-weight:700;color:' + (ativo ? info.cor : 'var(--title)') + '">' + info.label + '</div>'
      + '<div style="font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.4">' + info.desc + '</div>'
    + '</button>';
  }).join('');

  var blocos = ['leitura','escrita','comunicacao','critico'].map(function(cat){
    var acoes = ACOES_DISPONIVEIS.filter(function(x){ return x.cat === cat; });
    var cor = CAT_COR[cat];
    return '<div style="margin-bottom:16px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
        + '<span style="width:8px;height:8px;border-radius:50%;background:' + cor + '"></span>'
        + '<span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:' + cor + ';font-weight:700">' + CAT_LABEL[cat] + '</span>'
      + '</div>'
      + acoes.map(function(ac){
        var on = !!window._permissoes[ac.key];
        return '<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-left:2px solid ' + (on ? cor : 'rgba(255,255,255,.08)') + ';border-radius:8px;margin-bottom:6px;cursor:pointer">'
          + '<input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="togglePermissao(\'' + ac.key + '\',this.checked)" style="margin-top:3px;accent-color:' + cor + ';cursor:pointer">'
          + '<div style="flex:1"><div style="font-size:12px;color:var(--title);font-weight:600">' + ac.label + '</div>'
          + '<div style="font-size:10.5px;color:var(--dim);margin-top:2px">' + ac.desc + '</div></div>'
        + '</label>';
      }).join('')
    + '</div>';
  }).join('');

  return '<div>'

async function salvarPermissoes(){
  if(!window._agentAtual || !window._permissoes) return;
  var permissoes = {};
  ACOES_DISPONIVEIS.forEach(function(ac){ permissoes[ac.key] = !!window._permissoes[ac.key]; });
  try {
    var r = await fetch('/api/agentes/permissoes', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: window._agentAtual, autonomia: window._autonomia, permissoes: permissoes})
    });
    var j = await r.json();
    if(r.ok){
      var t = document.createElement('div');
      t.textContent = '✓ Permissões salvas';
      t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#12C7A0;color:#02070F;padding:10px 18px;border-radius:10px;font-weight:700;z-index:9999;animation:rise .25s ease both';

      setTimeout(function(){ t.remove(); }, 2200);

      alert('Erro ao salvar: ' + (j.erro || 'desconhecido'));

}

function abrirKanbanGeral(){

async function renderKanbanGeral(){
  var el = document.getElementById('kanban-geral');
  if(!el) return;
  try {
    var r = await fetch('/api/agentes');
    var lista = await r.json();
    var cols = ['backlog','fazendo','revisao','feito'];
    var counts = {}; cols.forEach(function(c){ counts[c] = 0; });
    Object.keys(lista).forEach(function(id){
      (lista[id].tarefas||[]).forEach(function(t){ if(counts[t.status] !== undefined) counts[t.status]++; });
    });
    var total = counts.backlog + counts.fazendo + counts.revisao + counts.feito;

    var colunas = cols.map(function(c){
      var cor = STATUS_COR[c];
      var cards = [];
      Object.keys(lista).forEach(function(id){
        var a = lista[id];
        (a.tarefas||[]).forEach(function(t){
          if(t.status !== c) return;
          cards.push(
            '<div style="background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-left:3px solid ' + a.cor + ';border-radius:8px;padding:10px 12px;margin-bottom:8px">'
              + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
                + '<div style="font-size:12px;color:var(--title);font-weight:600;line-height:1.35">' + t.titulo + '</div>'
                + '<span style="font-size:9px;color:' + a.cor + ';background:color-mix(in srgb,' + a.cor + ' 18%,transparent);border:1px solid color-mix(in srgb,' + a.cor + ' 35%,transparent);border-radius:10px;padding:1px 7px;white-space:nowrap;flex-shrink:0">' + a.nome + '</span>'
              + '</div>'
              + '<div style="font-size:10px;color:var(--dim);margin-top:5px">' + t.projeto + ' · ' + t.prazo + '</div>'
            + '</div>'
          );
        });
      });
      return '<div style="flex:1;min-width:230px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)">'
          + '<span style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:' + cor + ';font-weight:700">' + STATUS_LABEL[c] + '</span>'
          + '<span style="font-size:11px;color:var(--dim);background:rgba(0,0,0,.35);border-radius:10px;padding:1px 9px;font-weight:600">' + counts[c] + '</span>'
        + '</div>'
        + cards.join('')
      + '</div>';
    }).join('');

    el.innerHTML = ''
      + '<div style="margin-bottom:12px"><button class="btn" onclick="voltarAgentes()">← Voltar aos agentes</button></div>'
      + '<div class="front-head" style="margin-bottom:14px"><div class="fname">Kanban Geral</div>'
      + '<div class="fpurp">' + Object.keys(lista).length + ' agentes · ' + total + ' tarefas</div></div>'
      + '<div style="display:flex;gap:14px;flex-wrap:wrap">' + colunas + '</div>';
  } catch(e) {
    el.innerHTML = '<div class="empty">Erro ao carregar.</div>';
  }
}


window._liveTimer = null;

function _iniciarLiveFeed(id){
  if(window._liveTimer){ clearInterval(window._liveTimer); window._liveTimer = null; }
  _renderLiveFeed(id);
  window._liveTimer = setInterval(function(){ _renderLiveFeed(id); }, 3000);
}
window._pararLiveFeed = function(){
  if(window._liveTimer){ clearInterval(window._liveTimer); window._liveTimer = null; }
};

async function _renderLiveFeed(id){
  var box = document.getElementById('atividades-live');
  if(!box){ window._pararLiveFeed(); return; }
  try {
    var r = await fetch('/api/atividades?agente=' + encodeURIComponent(id) + '&limit=60');
    var j = await r.json();
    var atvs = j.atividades || [];

    var header = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px">'
      + '<div style="display:flex;align-items:center;gap:8px">'
        + '<span style="width:7px;height:7px;border-radius:50%;background:#12C7A0;box-shadow:0 0 8px #12C7A0;animation:pulse 1.5s infinite"></span>'
        + '<span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700">Atividades em tempo real</span>'
      + '</div>'
      + '<div style="font-size:10px;color:var(--dim)">' + atvs.length + ' eventos · polling 3s</div>'
    + '</div>';

    var items = '';
    if(atvs.length === 0){
      items = '<div style="color:var(--dim);text-align:center;padding:24px 0;font-size:11.5px">Sem atividades ainda. Os agentes aparecerao aqui ao executar.</div>';
    } else {
      atvs.forEach(function(a){
        var nivel = a.nivel || 'info';
        var cor = {info:'#00BFFF',ok:'#12C7A0',warn:'#FFB547',err:'#E84C62',running:'#00BFFF'}[nivel] || '#A9C3DB';
        var icon = {info:'\u203A',ok:'\u2713',warn:'!',err:'\u2717',running:'\u22EF'}[nivel] || '\u00B7';
        var partes = (a.ts || '').split(' ');
        var hora = partes.length > 1 ? partes[1] : (a.ts || '');
        items += '<div style="display:grid;grid-template-columns:70px 16px 1fr;gap:10px;align-items:start;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)">'
          + '<span style="color:#5F7B97">' + hora + '</span>'
          + '<span style="color:' + cor + ';font-weight:700;text-align:center">' + icon + '</span>'
          + '<span style="color:var(--text);line-height:1.5">' + (a.msg || '') + (a.artefato ? ' <span style="color:#5F7B97;font-size:10px">\u2192 ' + a.artefato + '</span>' : '') + '</span>'
        + '</div>';
      });
    }

    var oldFeed = document.getElementById('live-feed');
    var atBottom = true;
    if(oldFeed){ atBottom = (oldFeed.scrollHeight - oldFeed.scrollTop - oldFeed.clientHeight) < 40; }

    box.innerHTML = header + '<div id="live-feed" style="max-height:300px;overflow-y:auto;background:rgba(2,7,15,.55);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 14px;font-family:monospace;font-size:11px;line-height:1.55">' + items + '</div>';

    var nf = document.getElementById('live-feed');
    if(nf && atBottom){ nf.scrollTop = nf.scrollHeight; }
  } catch(e) {}
}

const S=(t,b)=>`<h4>${esc(t)}</h4>${b}`;

const LIM=m=>`<span class="bnote">Limitação: ${esc(m)}</span>`;

function findEntity(q){
  const ql=q.toLowerCase();
  const tries=[
    {list:L(),label:l=>l.nome,type:'lead'},
    {list:A(),label:a=>a.nome,type:'aluno'},
    {list:T(),label:t=>t.concurso,type:'turma'},
    {list:C(),label:c=>c.nome,type:'campanha'},
    {list:FN(),label:f=>f.aluno,type:'financeiro'}
  ];
  for(const t of tries)for(const i of t.list){const k=t.label(i).toLowerCase();if(k&&ql.includes(k))return{type:t.type,item:i}}
  return null;
}

function askAssistant(qRaw){
  const q=qRaw.toLowerCase();
  const k=calc();
  const ent=findEntity(qRaw);

  if(ent&&ent.type==='lead'){const l=ent.item;

      +S('Fatos',UL([`${t.leads} leads · cap ${t.capacidade} · meta ${t.meta}`,`Prof: ${esc(t.professor||'a definir')} · prazo ${dt(t.prazo)}`,`Riscos: ${esc((t.riscos||[]).join(' · ')||'—')}`]))
      +S('Próximo passo',`<p>${esc(t.proximaAcao)}</p>`),
      followups:['Que evidências faltam?','Qual outra turma merece atenção?']};
  }
  if(ent&&ent.type==='campanha'){const c=ent.item;const cpl=c.leads?c.investimento/c.leads:0;
    return{html:S('Resumo',`<p>Campanha <b>${esc(c.nome)}</b> — CPL R$ ${cpl.toFixed(2)}.</p>`)
      +S('Fatos',UL([`R$ ${c.investimento} · ${c.leads} leads · ${c.matriculas} matrículas`,`Meta CPL: R$ ${c.meta_cpl?.toFixed(2)||'—'}`]))
      +LIM('Atribuição estimada.'),
      followups:['Como comparar com outras campanhas?','Onde estamos investindo sem retorno?']};
  }
  if(ent&&ent.type==='aluno'){const a=ent.item;
    return{html:S('Resumo',`<p>Aluno <b>${esc(a.nome)}</b> (${esc(a.turma)}) — ${esc(a.risco)} · ${esc(a.situacao)}.</p>`)
      +S('Sinal',`<p>${esc(a.sinal)}</p>`)
      +S('Recomendação',`<p>${esc(a.proximaAcao)}</p>`),
      followups:['Quais outros alunos estão em risco?','Quais ações de recuperação estão em andamento?']};
  }
  if(ent&&ent.type==='financeiro'){const f=ent.item;
    return{html:S('Resumo',`<p><b>${esc(f.aluno)}</b> — ${esc(f.turma)} · R$ ${f.valor} · ${esc(f.status)}.</p>`)
      +S('Fatos',UL([`Vencimento: ${dt(f.vencimento)}`,`Dias em atraso: ${f.diasAtraso>0?f.diasAtraso:0}`]))
      +S('Recomendação',`<p>${f.diasAtraso>15?'Cobrança ativa + negociação.':'Lembrete leve.'}</p>`),
      followups:['Quem mais está inadimplente?','Qual o total vencido?']};
  }

  if(/atenção hoje|o que precisa|gargalo/i.test(q)){
    const al=AL().filter(a=>!a.lido&&a.tipo!=='OK').sort((a,b)=>({P0:0,P1:1,P2:2}[a.tipo]-{P0:0,P1:1,P2:2}[b.tipo]));
    return{html:S('Resumo',`<p>Há <b>${al.length}</b> alertas abertos entre todas as áreas.</p>`)
      +S('Top sinais',UL(al.slice(0,6).map(a=>`<b>${esc(a.tipo)}</b> · ${esc(a.grupo)} · ${esc(a.texto)}`)))
      +S('Recomendação',`<p>Atacar P0 primeiro. Depois avaliar Financeira + Comercial em conjunto.</p>`),
      followups:['Quais P0 estão abertos?','Quais leads estão sem retorno?','Quem está inadimplente?']};
  }
  if(/inadimplência|inadimplente|mensalidade.*vencid|vencido/i.test(q)){
    const v=FN().filter(x=>x.status==='vencido').sort((a,b)=>b.diasAtraso-a.diasAtraso);

  if(/sobrecarreg|quem está no limite|redistribu/i.test(q)){
    const rh=RH().filter(x=>x.status==='sobrecarga'||x.status==='atencao');
    return{html:S('Resumo',`<p><b>${rh.length}</b> pessoa(s) em atenção.</p>`)
      +UL(rh.map(r=>`<b>${esc(r.nome)}</b> (${esc(r.cargo)}) — ${esc(r.alerta)}`))

      followups:['Como está o plano de carreira?','Quais benefícios estão ativos?']};

  if(/plano de carreira|benefíc/i.test(q)){
    const b=RHB();
    return{html:S('Resumo',`<p>${b.length} benefícios cadastrados.</p>`)
      +UL(b.map(x=>`<b>${esc(x.item)}</b> — ${esc(x.status)}`)),
      followups:['Quem está sobrecarregado?','Como está a retenção?']};
  }
  if(/estrutura|equipament|reparo|sala.*problem/i.test(q)){
    const es=ES();
    return{html:S('Resumo',`<p><b>${es.length}</b> itens com pendência.</p>`)
      +UL(es.slice(0,6).map(x=>`<b>${esc(x.item)}</b> (${esc(x.local)}) — ${esc(x.problema)} [${esc(x.severidade)}]`)),
      followups:['Qual o impacto no aluno?','Quanto custa resolver?']};
  }
  if(/serviço.*fora|backup|infra|integraç/i.test(q)){
    const ti=TI();
    return{html:S('Resumo',`<p>${ti.filter(x=>x.status==='online').length}/${ti.length} serviços online.</p>`)
      +UL(ti.map(x=>`<b>${esc(x.servico)}</b> — ${esc(x.status)}${x.alerta?' · '+esc(x.alerta):''}`)),
      followups:['Último backup rodou?','Como está a segurança?']};
  }
  if(/agenda.*hoje|o que tenho hoje|compromiss/i.test(q)){
    const ag=AG().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).slice(0,6);
    return{html:S('Resumo',`<p>Próximos compromissos:</p>`)
      +UL(ag.map(x=>`<b>${dt(x.data)} ${x.hora}</b> — ${esc(x.titulo)} (${esc(x.sala)})`)),
      followups:['O que está sem confirmação?','Quais reposições estão pendentes?']};
  }
  if(/unidade|filial|abrir.*unidade/i.test(q)){
    const f=FIL();
    return{html:S('Resumo',`<p><b>${f.length}</b> unidades mapeadas.</p>`)
      +UL(f.map(x=>`<b>${esc(x.nome)}</b> — ${x.alunos} alunos · ticket R$ ${x.ticketMedio} · ${esc(x.status)}`)),
      followups:['Qual filial é mais rentável?','Vale abrir nova unidade?']};
  }
  if(/priorizar.*lead|leads.*hoje/i.test(q)){
    const p=L().filter(l=>l.prioridade==='alta'&&l.etapa!=='Perdido'&&l.etapa!=='Matrícula confirmada');
    return{html:S('Resumo',`<p><b>${p.length}</b> leads alta prioridade.</p>`)
      +UL(p.map(l=>`<b>${esc(l.nome)}</b> — ${esc(l.concurso)}, ${esc(l.etapa)} (${esc(l.responsavel)})`)),
      followups:['Quais leads estão sem retorno?','Quais estão próximos de fechar?']};
  }
  if(/sem retorno|24h/i.test(q)){
    const l=L().filter(x=>x.etapa!=='Perdido'&&x.etapa!=='Matrícula confirmada'&&daysAgo(x.ultimoContato)>1).sort((a,b)=>daysAgo(b.ultimoContato)-daysAgo(a.ultimoContato));
    return{html:S('Resumo',`<p><b>${l.length}</b> lead(s) sem retorno +24h.</p>`)
      +UL(l.slice(0,8).map(x=>`<b>${esc(x.nome)}</b> — ${daysAgo(x.ultimoContato)}d · ${esc(x.concurso)}`)),
      followups:['Quais estão próximos de fechar?','Quais objeções aparecem mais?']};
  }
  if(/menor cpl/i.test(q)){
    const c=C().filter(x=>x.leads>0).map(x=>({x,cpl:x.investimento/x.leads})).sort((a,b)=>a.cpl-b.cpl);
    return{html:S('Resumo',`<p>Menor CPL: <b>${esc(c[0]?.x.nome||'—')}</b> — R$ ${(c[0]?.cpl||0).toFixed(2)}.</p>`)
      +S('Comparativo',UL(c.slice(0,5).map(v=>`${esc(v.x.nome)}: R$ ${v.cpl.toFixed(2)}`)))
      +LIM('Atribuição estimada.'),
      followups:['Quais campanhas geram leads que avançam?','Onde investimos sem retorno?']};
  }
  if(/investindo sem|sem.*matrícul/i.test(q)){
    const s=C().filter(x=>x.investimento>0&&x.matriculas===0);
    return{html:S('Resumo',`<p><b>${s.length}</b> campanha(s) sem matrícula — R$ ${k.investSemMat.toLocaleString('pt-BR')}.</p>`)
      +UL(s.map(x=>`<b>${esc(x.nome)}</b> — R$ ${x.investimento} · ${x.leads} leads`)),
      followups:['Quais campanhas merecem investigação?','Qual campanha tem menor CPL?']};
  }
  if(/aluno.*acompanhament|precisam.*acompanh/i.test(q)){
    const a=A().filter(x=>x.situacao!=='resolvido'&&x.risco!=='OK');
    return{html:S('Resumo',`<p><b>${a.length}</b> aluno(s) em atenção.</p>`)
      +UL(a.slice(0,8).map(x=>`<b>${esc(x.nome)}</b> (${esc(x.turma)}) — ${esc(x.sinal)}`)),
      followups:['Quem teve faltas consecutivas?','Quais casos estão sem retorno?']};
  }
  if(/melhor oportunidade|turma.*melhor/i.test(q)){
    const t=T().sort((a,b)=>b.confianca-a.confianca)[0];
    return{html:S('Resumo',`<p>Maior confiança: <b>${esc(t.concurso)}</b> (${esc(t.regiao)}) — ${Math.round(t.confianca*100)}%.</p>`)
      +S('Próximo passo',`<p>${esc(t.proximaAcao)}</p>`),
      followups:['Que evidências faltam?','Quais turmas testar?']};
  }
  if(/inscrições abertas/i.test(q)){
    const r=R().filter(x=>x.tipo==='aberto');
    return{html:S('Resumo',`<p><b>${r.length}</b> com inscrições abertas.</p>`)
      +UL(r.map(x=>`<b>${esc(x.concurso)}</b> — ${esc(x.inscricoes)}`)),
      followups:['Quais datas precisam verificação?']};
  }

  return{html:S('Resumo','<p>Não identifiquei consulta específica.</p>')
    +S('Sugestões',UL(['O que precisa da minha atenção hoje?','Quem está inadimplente?','Qual campanha apresenta o menor CPL?','Quem está sobrecarregado no RH?','Quais serviços estão fora?','O que tenho na agenda?'])),
    followups:[]};
}

/* ============ RENDER + EVENTS ============ */
function render(){
  renderNav();
  if(state.detail)el('main').innerHTML=viewRecords(state.detail.front);
  else el('main').innerHTML=(VIEWS[state.view]||viewPrincipal)();
  el('main').scrollTop=0;
}

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-r]');
  if(nav){state.view=nav.dataset.r;state.detail=null;state.selRecord=null;render();return}
  const rec=e.target.closest('[data-records-front]');
  if(rec){state.detail={front:rec.dataset.recordsFront};state.selRecord=null;render();return}
  if(e.target.closest('[data-back]')){state.detail=null;state.selRecord=null;render();return}
  const tr=e.target.closest('tr[data-rec]');
  if(tr){state.selRecord=tr.dataset.rec;render();return}
  // Toggle dropdown de alerta (clicando em qualquer parte da linha, exceto botões)
  const alertLine=e.target.closest('[data-alert]');
  if(alertLine && !e.target.closest('button')){
    const id=alertLine.dataset.alert;
    state.expanded[id]=!state.expanded[id];
    render();return;
  }
  const ask=e.target.closest('[data-ask]');
  if(ask){submitQuestion(ask.dataset.ask);return}
  const fu=e.target.closest('[data-followup]');
  if(fu){submitQuestion(fu.dataset.followup);return}
  const qt=e.target.closest('[data-q-toggle]');
  if(qt){const f=qt.dataset.qToggle;state.qExpanded[f]=!state.qExpanded[f];render();return}
  const lido=e.target.closest('[data-lido]');
  if(lido){marcarAlertaLido(lido.dataset.lido);return}
  const radar=e.target.closest('[data-radar]');
  if(radar){submitQuestion('Mostre um panorama do radar de concursos.');return}
  if(e.target.closest('[data-chat="close"]')){el('chat').classList.remove('open');return}
  if(e.target.closest('[data-chat="clear"]')){chatInitial();chatDraw();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-rec]'))e.target.click();
});
el('cf').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=el('ci');const q=inp.value.trim();
  if(!q)return;inp.value='';submitQuestion(q);
});
el('chat').addEventListener('click',e=>{
  if(!el('chat').classList.contains('open')&&!e.target.closest('button'))openChat();
});

/* ==================================================================
   INTEGRAÇÃO BACKEND · EPQ Central V10
   Substitui a persistência local (localStorage) pela API do backend.
   Depende de globais já definidos no painel: state, render, S, UL, LIM,
   esc, askAssistant, DEMO_TAG, REF, chatInitial/chatDraw.
   Se a API não responder, o painel continua com os dados locais (demo).
   ================================================================== */
const API = { base: window.EPQ_API_BASE || '', timeoutMs: 8000 };
let integracao = { online: false, origem: 'local', geradoEm: null, erro: null };

async function apiFetch(caminho, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), API.timeoutMs);
  try {
    const r = await fetch(API.base + caminho, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Accept: 'application/json', ...(opts.headers || {}) },
      signal: ctrl.signal,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || `HTTP ${r.status}`);
    return j;
  } finally {
    clearTimeout(timer);
  }
}

function atualizarEtiquetaConexao() {
  DEMO_TAG = integracao.online
    ? `BACKEND CONECTADO · ${integracao.geradoEm ? new Date(integracao.geradoEm).toLocaleTimeString('pt-BR') : ''}`
    : `MODO LOCAL · sem backend${integracao.erro ? ' (' + integracao.erro + ')' : ''}`;
}

async function bootIntegracao() {
  try {
    const s = await apiFetch('/api/snapshot');
    Object.assign(state.data, s.data || {});
    state.edits = {};
    if (s.referencia) REF = s.referencia;
    integracao = { online: true, origem: 'backend', geradoEm: s.geradoEm, erro: null };
  } catch (e) {
    integracao = { online: false, origem: 'local', geradoEm: null, erro: e.message };
  }
  atualizarEtiquetaConexao();
  render();
}

/* Marcar alerta como lido: otimista, com reversão se o backend recusar. */
async function marcarAlertaLido(id) {
  const al = state.data.alertas.find((a) => a.id === id);
  if (!al) return;
  const anterior = al.lido;
  al.lido = true;
  render();
  if (!integracao.online) return;
  try {
    const atualizado = await apiFetch(`/api/alertas/${encodeURIComponent(id)}`, {
      method: 'PATCH',
      body: JSON.stringify({ lido: true }),
    });
    Object.assign(al, atualizado);
  } catch (e) {
    al.lido = anterior;
    render();
  }
}

/* Resposta estruturada do backend -> HTML do chat (com escape). */
function renderRespostaEstruturada(r) {
  let h = S('Resumo', `<p>${esc(r.resumo)}</p>`);
  if (r.fatos && r.fatos.length) h += S('Fatos', UL(r.fatos.map(esc)));
  if (r.proximoPasso) h += S('Próximo passo', `<p>${esc(r.proximoPasso)}</p>`);
  if (r.mensagem) {
    h += S('Mensagem', `<p style="background:rgba(0,0,0,.22);border-radius:9px;padding:9px;color:#DCEBF9">${esc(r.mensagem)}</p>`);
  }
  if (r.limitacao) h += LIM(r.limitacao);
  return h;
}

async function responderAssistente(q) {
  if (integracao.online) {
    try {
      const r = await apiFetch('/api/assistente', { method: 'POST', body: JSON.stringify({ pergunta: q }) });
      return { html: renderRespostaEstruturada(r), followups: r.followups || [] };
    } catch (e) {
      /* sem resposta do backend: cai para o assistente local */
    }
  }
  return askAssistant(q);
}

async function submitQuestion(q) {
  if (!q) return;
  openChat();
  pushUser(q);
  const a = await responderAssistente(q);
  setTimeout(() => pushBot(a.html, a.followups), 160);
}


chatInitial();
render();
chatDraw();
bootIntegracao();
</script>
<script>
/* EPQ · efeitos visuais (isolado do JS do painel — só lê `state`, nunca escreve) */
(function(){
"use strict";
var bg=document.querySelector('.bg'),main=document.getElementById('main');
if(!bg||!main)return;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce)return;                       /* sem movimento: CSS estático já cobre */

/* ---- paralaxe: mouse + rolagem do painel, com suavização ---- */
var tx=0,ty=0,ts=0,cx=0,cy=0,cs=0,raf=0;
function step(){
  cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;cs+=(ts-cs)*.12;
  bg.style.setProperty('--px',cx.toFixed(3));
  bg.style.setProperty('--py',cy.toFixed(3));
  bg.style.setProperty('--sy',cs.toFixed(1));
  raf=(Math.abs(tx-cx)>.002||Math.abs(ty-cy)>.002||Math.abs(ts-cs)>.3)?requestAnimationFrame(step):0;
}
function kick(){if(!raf)raf=requestAnimationFrame(step)}

/* ---- luz no contorno do painel que acompanha o cursor ---- */
var SEL='aside.glass,.kpi-c,.alert-line,.opp-item,.radar-strip,.card,#chat';
var hot=null,hx=0,hy=0,sr=0;
function spot(){
  sr=0;if(!hot)return;
  var r=hot.getBoundingClientRect();
  hot.style.setProperty('--mx',(hx-r.left)+'px');
  hot.style.setProperty('--my',(hy-r.top)+'px');
}
document.addEventListener('pointermove',function(e){
  if(e.pointerType&&e.pointerType!=='mouse')return;
  tx=(e.clientX/window.innerWidth-.5)*2;
  ty=(e.clientY/window.innerHeight-.5)*2;
  kick();
  hot=e.target.closest?e.target.closest(SEL):null;
  hx=e.clientX;hy=e.clientY;
  if(hot&&!sr)sr=requestAnimationFrame(spot);
},{passive:true});
main.addEventListener('scroll',function(){ts=Math.min(main.scrollTop,600);kick()},{passive:true});

/* ---- entrada orquestrada + contagem dos KPIs: apenas quando a TELA muda ---- */
var lastKey=null;
function viewKey(){
  try{return state.view+'|'+(state.detail?state.detail.front:'')}
  catch(e){return main.firstElementChild?main.firstElementChild.className:''}
}
function countUp(){
  var nodes=main.querySelectorAll('.kv');
  Array.prototype.forEach.call(nodes,function(n){
    var t=n.textContent.trim();
    if(!/^\d{1,6}$/.test(t))return;      /* só inteiros simples; o resto fica intacto */
    var end=+t,t0=null;
    n.textContent='0';
    (function f(now){
      if(t0===null)t0=now;
      var p=Math.min((now-t0)/800,1);
      n.textContent=p<1?String(Math.round(end*(1-Math.pow(1-p,3)))):t;
      if(p<1)requestAnimationFrame(f);
    })(performance.now());
  });
}
function onRender(){
  var k=viewKey();
  if(k===lastKey)return;                 /* re-render por expandir/filtrar: não reanima */
  lastKey=k;
  main.classList.remove('enter');
  void main.offsetWidth;
  main.classList.add('enter');
  countUp();
}
new MutationObserver(onRender).observe(main,{childList:true});
onRender();
})();
</script>
