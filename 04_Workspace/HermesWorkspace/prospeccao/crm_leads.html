const PER_PAGE = 15;
const FILTERS = {search:'',fit:'',temp:''};
const CHIPS = ['Alta','Média','Média-Baixa','Baixa'];
let prio='');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderStats(){
    document.querySelector('.subtitle').innerHTML = `414 leads · fit médio: ${Math.round(LEADS.reduce((a,l)=>a+l.fit,0)/LEADS.length)} · prioritários: ${LEADS.filter(l=>l.fitCls==='max').length}`;
}

function renderChips(){
    const row=document.getElementById('chips');
    row.innerHTML='<div class="chip active" data-prio="">Prioridade: todas</div>'+CHIPS.map(x=>`<div class="chip" data-prio="${esc(x)}">${esc(x)}<span class="n">${LEADS.filter(l=>l.prioridade===x).length}</span></div>`).join('');
    row.addEventListener('click',e=>{
        const chip=e.target.closest('.chip');
        if(!chip)return;
        row.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        prio=chip.dataset.prio;
        page=1;render();
    });
}

function filtered(){
    const q=FILTERS.search.toLowerCase();
    return LEADS.filter(l=>{
        if(FILTERS.fit&&l.fitCls!==FILTERS.fit)return false;
        if(FILTERS.temp&&l.temp!==FILTERS.temp)return false;
        if(prio&&l.prioridade!==prio)return false;
        if(q&&!([l.nome,l.empresa,l.cargo,l.setor,l.tipo].join(' ').toLowerCase().includes(q)))return false;
        return true;
    }).sort((a,b)=>b.fit-a.fit);
}

function card(l){
    const evita='';
    return `<div class="card f-${l.fitCls}">
        <div class="lh">
            <div>
                <div class="name">${esc(l.nome)}</div>
                <div class="role">${esc(l.cargo)}</div>
                <div class="emp">${esc(l.empresa)}</div>
            </div>
            <div class="badges">
                <span class="badge b-f${l.fitCls==='max'?'max':l.fitCls==='forte'?'forte':l.fitCls==='boa'?'boa':l.fitCls==='adaptar'?'adaptar':'nao'}">Fit ${l.fit}</span>
                <span class="badge" style="background:rgba(109,91,255,.12);color:#b3a8ff">${esc(l.setor)}</span>
            </div>
        </div>
        <div class="meta">
            <span><b>${esc(l.prioridade)}</b> · ${esc(l.temp)}</span>
            ${l.linkedin?`<a href="${esc(l.linkedin)}" target="_blank" style="color:var(--accent2)">LinkedIn ↗</a>`:''}
            ${l.email?`<a href="mailto:${esc(l.email)}" style="color:var(--accent2)">${esc(l.email)}</a>`:''}
        </div>
        <div class="msg">${esc(l.mensagem).slice(0,350)}${l.mensagem.length>350?'...':''}</div>
        <div class="actions">
            <button class="btn btn-p" onclick="copyMsg(${l.id})">Copiar mensagem</button>
            ${l.email?`<button class="btn btn-g" onclick="copyText('${esc(l.email)}','E-mail copiado ✓')">Copiar e-mail</button>`:''}
        </div>
    </div>`;
}

let page=1;
function render(){
    const arr=filtered();
    const pages=Math.max(1,Math.ceil(arr.length/PER_PAGE));
    if(page>pages)page=pages;
    const slice=arr.slice((page-1)*PER_PAGE,page*PER_PAGE);
    const grid=document.getElementById('grid');
    grid.innerHTML=slice.length?slice.map(card).join(''):'<div class="empty">Nenhum lead encontrado.</div>';
    document.getElementById('pagination').innerHTML=`<button class="page-btn" ${page===1?'disabled':''} onclick="go(${page-1})">← Anterior</button><span>${page} / ${pages}</span><button class="page-btn" ${page===pages?'disabled':''} onclick="go(${page+1})">Próxima →</button>`;
}

function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}

function copyText(t,ok){navigator.clipboard?.writeText(t).then(()=>toast(ok)).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(ok)})}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2000)}

window.copyMsg=function(id){const l=LEADS.find(x=>x.id===id);if(l)copyText(l.mensagem,'Mensagem de '+l.nome.split(' ')[0]+' copiada ✓')};

['search','filterFit','filterTemp'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',e=>{
    const key=id==='filterFit'?'fit':'temp';
    FILTERS[key]=e.target.value;
    page=1;render();
}));

renderStats();
renderChips();
render();
</script>
