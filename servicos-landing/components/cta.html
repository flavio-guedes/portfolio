<section class="section section-cta" id="contato">
  <div class="container">
    <div class="cta-inner fade-in">
      <div class="eyebrow">Próximo passo</div>
      <h2 class="section-title" id="cta-title">Vamos conversar</h2>
      <p class="lead" id="cta-lead"></p>
      <div class="cta-actions">
        <a class="btn btn-primary" href="https://wa.me/5521999719474" target="_blank" rel="noopener">Quero conversar sobre o projeto</a>
        <a class="btn btn-secondary" href="#hero">Voltar ao topo</a>
      </div>
      <form class="lead-form" id="lead-form" autocomplete="on">
        <div class="form-row">
          <label>Nome</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-row">
          <label>E-mail</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-row">
          <label>WhatsApp</label>
          <input type="tel" name="whatsapp" required>
        </div>
        <div class="form-row">
          <label>Empresa / Projeto</label>
          <input type="text" name="company" required>
        </div>
        <div class="form-row">
          <label>O que você precisa?</label>
          <select name="need" required>
            <option value="" disabled selected>Selecione</option>
            <option>Quero contratar este serviço</option>
            <option>Quero entender se faz sentido</option>
            <option>Tenho um projeto específico</option>
            <option>Quero conversar sobre parceria</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="form-row">
          <label>Mensagem</label>
          <textarea name="message" rows="4"></textarea>
        </div>
        <input type="hidden" name="service" id="form-service">
        <input type="hidden" name="landing_page" id="form-landing">
        <input type="hidden" name="source" value="landing-page">
        <input type="hidden" name="timestamp" id="form-timestamp">
        <button class="btn btn-primary" type="submit">Quero conversar sobre o projeto</button>
      </form>
    </div>
  </div>
</section>
