<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo IA Concursos · Demonstração</title>
<style>
  :root{
    --bg0:#0b0c0f; --bg1:#0f1114; --bg2:#14161a;
    --card:rgba(26,28,33,.92); --card2:rgba(18,20,24,.95);
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --hl:rgba(255,255,255,.2);
    --track:rgba(255,255,255,.08);
    --input:rgba(10,11,14,.8);
    --txt:#e8eaee; --muted:#9ea4ae; --dim:#6c727d;
    --accent:#4f6a95; --accent-h:#415a82;
    --navon:rgba(79,106,149,.22); --selbg:rgba(79,106,149,.16);
    --frame:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 45%,rgba(255,255,255,.12));
    --sep:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16) 16%,rgba(255,255,255,.16) 84%,rgba(255,255,255,0)) bottom/100% 1px no-repeat;
    --hline:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,0) 85%) bottom/100% 1px no-repeat;
    --k-alert:#f87171; --k-date:#fbbf24; --k-vagas:#f472b6; --k-money:#4ade80; --k-org:#60a5fa;
    --k-banca:#818cf8; --k-local:#22d3ee; --k-edital:#38bdf8; --k-materia:#2dd4bf; --k-estudo:#fb923c;
    --k-sim:#a78bfa; --k-goal:#f97316; --k-prog:#a3e635; --k-ok:#34d399; --k-link:#60a5fa;
    --k-portal:#10b981; --k-question:#67e8f9; --k-video:#e879f9; --k-lei:#eab308; --k-tag:#94a3b8;
    --k-search:#94a3b8; --k-refresh:#0ea5e9;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg0:#f3f4f6; --bg1:#eceef2; --bg2:#e5e8ee;
    --card:rgba(255,255,255,.94); --card2:rgba(250,250,251,.97);
    --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.16);
    --hl:rgba(15,23,42,.22);
    --track:rgba(15,23,42,.08);
    --input:rgba(255,255,255,.9);
    --txt:#161a21; --muted:#545b67; --dim:#7f8691;
    --accent:#3f5f94; --accent-h:#34507e;
    --navon:rgba(63,95,148,.14); --selbg:rgba(63,95,148,.09);
    --frame:linear-gradient(135deg,rgba(15,23,42,.22),rgba(15,23,42,.04) 45%,rgba(15,23,42,.14));
    --sep:linear-gradient(90deg,rgba(15,23,42,0),rgba(15,23,42,.14) 16%,rgba(15,23,42,.14) 84%,rgba(15,23,42,0)) bottom/100% 1px no-repeat;
    --hline:linear-gradient(90deg,rgba(15,23,42,.3),rgba(15,23,42,0) 85%) bottom/100% 1px no-repeat;
    --k-alert:#dc2626; --k-date:#b45309; --k-vagas:#db2777; --k-money:#15803d; --k-org:#1d4ed8;
    --k-banca:#4338ca; --k-local:#0e7490; --k-edital:#0369a1; --k-materia:#0f766e; --k-estudo:#c2410c;
    --k-sim:#6d28d9; --k-goal:#ea580c; --k-prog:#4d7c0f; --k-ok:#047857; --k-link:#1d4ed8;
    --k-portal:#047857; --k-question:#0e7490; --k-video:#a21caf; --k-lei:#a16207; --k-tag:#475569;
    --k-search:#475569; --k-refresh:#0369a1;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--txt);font-size:13px;line-height:1.5;overflow:hidden;
       background:linear-gradient(180deg,var(--bg0),var(--bg1) 55%,var(--bg2));transition:background .4s ease,color .4s ease}
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  a{color:var(--k-link);text-decoration:none;word-break:break-all}
  a:hover{text-decoration:underline}
  strong,b{font-weight:600;color:var(--txt)}
  p{color:var(--muted)}
  .ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .ico.s{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
  .view,.sidecol,.log{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

  /* CATEGORIAS (ÍCONES COLORIDOS) */
  .k-alert{color:var(--k-alert)} .k-date{color:var(--k-date)} .k-vagas{color:var(--k-vagas)}
  .k-money{color:var(--k-money)} .k-org{color:var(--k-org)} .k-banca{color:var(--k-banca)}
  .k-local{color:var(--k-local)} .k-edital{color:var(--k-edital)} .k-materia{color:var(--k-materia)}
  .k-estudo{color:var(--k-estudo)} .k-sim{color:var(--k-sim)} .k-goal{color:var(--k-goal)}
  .k-prog{color:var(--k-prog)} .k-ok{color:var(--k-ok)} .k-link{color:var(--k-link)}
  .k-portal{color:var(--k-portal)} .k-question{color:var(--k-question)} .k-video{color:var(--k-video)}
  .k-lei{color:var(--k-lei)} .k-tag{color:var(--k-tag)} .k-search{color:var(--k-search)} .k-refresh{color:var(--k-refresh)}

  /* REVELAÇÃO COM PARALAXE */
  .rv{opacity:0;transform:translate3d(var(--rx,0px),var(--ry,28px),0)}
  .rv.in{opacity:1;transform:none;transition:opacity .9s ease var(--d,0ms),transform 1.1s cubic-bezier(.16,.84,.24,1) var(--d,0ms)}
  .rv.still,.rv.still.in{transition:none!important}
  .blk.rv{--ry:40px}
  .blk-b>.rv,.grid4>.rv,.cards>.rv,.qlist>.rv,.filtros>.rv{--ry:0px;--rx:-12px}
  .cc.rv,.portal.rv,.qitem.rv,.sg.rv,.tl.rv{--ry:14px;--rx:0px}
  .blk.px{will-change:translate}

  /* LAYOUT */
  .app{display:grid;grid-template-columns:var(--ws,200px) 10px minmax(360px,1fr) 12px var(--wd,240px);height:100vh;height:100dvh;padding:10px}
  .app.dragging{cursor:col-resize;user-select:none}
  .rz{grid-column:2;position:relative;cursor:col-resize;touch-action:none;outline:none}
  .rz::before{content:"";position:absolute;top:12%;bottom:12%;left:50%;width:1px;margin-left:-.5px;background:var(--line)}
  .rz:hover::before,.rz:focus-visible::before,.app.dragging .rz::before{background:var(--hl);width:2px;margin-left:-1px}

  /* MENU */
  .side{grid-column:1;display:flex;flex-direction:column;min-height:0;padding:4px}
  .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 12px}
  .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
  .brand b{display:block;font-size:13px}
  .brand small{color:var(--dim);font-size:11px}
  .group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:12px 10px 5px;font-weight:600}
  .nav-list{display:flex;flex-direction:column;gap:2px}
  .nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);width:100%;text-align:left;position:relative}
  .nav:hover{color:var(--txt);background:var(--track)}
  .nav.on{color:var(--txt);background:var(--navon)}
  .nav.on::before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:2px;border-radius:2px;background:var(--accent)}
  .count{margin-left:auto;font-size:10.5px;color:var(--k-alert);border:1px solid currentColor;padding:0 6px;border-radius:999px;opacity:.85}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .theme{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--muted);border:1px solid var(--line2);font-size:12px;width:100%}
  .theme:hover{color:var(--txt);border-color:var(--accent)}
  .userbox{display:flex;gap:10px;align-items:center;padding:10px 8px 2px;background:var(--sep)}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
  .userbox small{display:block;color:var(--dim);font-size:11px}

  /* CENTRO */
  .col{grid-column:3;display:flex;flex-direction:column;min-height:0;gap:8px}
  .view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-right:6px}
  .pg{flex:1 0 auto;display:flex;flex-direction:column;gap:8px}
  .grow{flex:1 0 auto}

  /* BLOCOS */
  .blk,.sidecol,.foot{
    background:linear-gradient(180deg,var(--card),var(--card2)) padding-box,var(--frame) border-box;
    border:1px solid transparent;border-radius:12px}
  [data-theme="light"] .blk,[data-theme="light"] .foot{box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .blk{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .blk-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-bottom:9px;background:var(--hline)}
  .blk-sub{color:var(--dim);font-size:11.5px;margin-top:-6px}
  .blk-b{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;min-height:0}
  .blk-b>.ln,.blk-b>.task,.blk-b>.fonte,.blk-b>.bar-row,.blk-b>.kpi,.blk-b>.pl-r{flex:1 1 auto;justify-content:center}
  .blk-b>.ln,.blk-b>.task{align-items:center}
  .blk-b>.bar-row,.blk-b>.kpi,.blk-b>.fonte{display:flex;flex-direction:column}
  .blk-b>.pl-r{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
  .blk-b>.rec{flex:1 1 auto;justify-content:center}
  .grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px;align-items:stretch}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .links{margin-top:auto;display:flex;flex-direction:column}

  /* LINHAS COM DEGRADÊ */
  .ln{display:flex;gap:10px;align-items:flex-start;padding:8px 0;background:var(--sep)}
  .ln:last-child{background:none}
  .ln .ico{margin-top:2px}
  .ln .t{flex:1;min-width:0}
  .ln .t small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex-shrink:0}
  .nc{color:var(--k-goal);font-size:11.5px}

  /* BARRAS */
  .track{height:4px;border-radius:99px;background:var(--track);overflow:hidden}
  .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7d93b8)}
  .track i.w{background:linear-gradient(90deg,#b45309,#d97706)}
  .track i.ok{background:linear-gradient(90deg,#059669,#34d399)}
  .bar-row{padding:8px 0;background:var(--sep)}
  .bar-row:last-child{background:none}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .bar-row .lbl b{color:var(--txt)}

  /* PÍLULAS E BOTÕES */
  .pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center}
  .pill.g{border-color:color-mix(in srgb,var(--k-ok) 50%,transparent);color:var(--k-ok)}
  .pill.a{border-color:color-mix(in srgb,var(--k-date) 50%,transparent);color:var(--k-date)}
  .pill.r{border-color:color-mix(in srgb,var(--k-alert) 50%,transparent);color:var(--k-alert)}
  .pill.b{border-color:color-mix(in srgb,var(--k-org) 45%,transparent);color:var(--k-org)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn{padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .btn:hover{background:var(--accent-h)}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
  .btn.ghost:hover{border-color:var(--accent)}

  /* CONCURSOS */
  .filtros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .filtros label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .filtros select{appearance:none;width:100%;padding:7px 28px 7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--input) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239ea4ae' stroke-width='1.5'/></svg>") no-repeat right 10px center;color:var(--txt);font-size:12.5px;font-weight:400;text-transform:none;letter-spacing:0;outline:none}
  .filtros select:focus{border-color:var(--accent)}
  .filtros select option{background:var(--card2);color:var(--txt)}
  .cards{flex:1 1 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:1fr;gap:6px;align-content:stretch}
  .cc{text-align:left;padding:11px;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border:1px solid var(--line);background:var(--input)}
  .cc:hover{border-color:var(--line2)}
  .cc.sel{border-color:var(--accent);background:var(--selbg)}
  .cc span{display:block}
  .cc .org{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .cc .cargo{color:var(--muted);font-size:11.5px}
  .cc .tags{display:flex}
  .cc .meta{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
  .cc .meta b{color:var(--txt);font-weight:600}
  .timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));border-radius:10px;border:1px solid var(--line);overflow:hidden}
  .tl{padding:9px 8px;text-align:center}
  .tl + .tl{background:linear-gradient(180deg,rgba(127,127,127,0),var(--hl),rgba(127,127,127,0)) left/1px 100% no-repeat}
  .tl small{display:flex;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:10.5px}
  .tl b{font-size:12px;font-weight:600}
  .portal{padding:9px 11px;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .portal b{font-size:12px;display:flex;align-items:center;gap:6px}
  .portal small{color:var(--dim);font-size:11px}

  /* FONTES E ESTUDO */
  .chips-f{display:flex;gap:6px;flex-wrap:wrap}
  .chip-f{padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-size:11.5px;font-weight:500}
  .chip-f:hover{color:var(--txt)}
  .chip-f.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fonte{padding:10px 0;display:flex;flex-direction:column;gap:5px;background:var(--sep)}
  .fonte:last-child{background:none}
  .fonte-top{display:flex;justify-content:space-between;align-items:center}
  .fonte-tp{display:flex;align-items:center;gap:6px}
  .fonte h4{font-size:13px;font-weight:600}
  .fonte p{font-size:12px}
  .fonte .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--dim)}
  .fonte.old h4{color:var(--k-alert)}
  .tg{font-size:10.5px;font-weight:600;padding:0 7px;border-radius:5px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.04em}

  /* PLANO */
  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer;background:var(--sep)}
  .task:last-child{background:none}
  .task input{margin-top:4px;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
  .task .body{flex:1;min-width:0}
  .task .body b{font-weight:600}
  .task .body p{font-size:12px}
  .task .body small{color:var(--dim);font-size:11.5px;display:block}
  .task.done .body b{text-decoration:line-through;color:var(--dim)}
  .big{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .big span{font-size:18px;color:var(--dim);margin-left:4px}
  .seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .sg{display:flex;flex-direction:column;gap:7px}
  .sg i{display:block;height:6px;border-radius:99px;background:var(--track)}
  .sg.ok i{background:linear-gradient(90deg,#059669,#34d399)}
  .sg small{color:var(--dim);font-size:11px}

  /* PERGUNTAS */
  .qlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
  .qitem{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 0;color:var(--muted);font-size:12.5px;background:var(--sep)}
  .qitem:hover{color:var(--txt)}

  /* RECOMENDAÇÃO */
  .rec{display:flex;flex-direction:column;gap:5px;padding:2px 0}
  .rec-t{font-weight:600;color:var(--txt)}
  .rec-s{font-size:11.5px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .rec-n{font-size:12.5px;margin-top:2px}
  .rec-n b{color:var(--muted);font-weight:600}

  /* DADOS (LATERAL) */
  .sidecol{grid-column:5;min-height:0;overflow:hidden;padding:14px}
  .kpi{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 0;background:var(--sep)}
  .kpi:last-child{background:none}
  .kpi-h{display:flex;align-items:center;gap:8px}
  .kpi small{color:var(--dim);font-size:11px}
  .kpi .val{font-size:21px;font-weight:600;letter-spacing:-.01em;color:var(--txt);white-space:nowrap;padding-left:23px}
  .kpi .val span{font-size:11px;color:var(--dim);margin-left:4px;font-weight:500}

  /* COPILOTO (RODAPÉ RECOLHÍVEL) */
  .foot{flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
  .foot-h{display:flex;align-items:center;gap:8px;padding:8px 14px}
  .foot-h .title{font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center}
  .tog{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid var(--line2)}
  .tog:hover{color:var(--txt);border-color:var(--accent)}
  .tog .ico{transition:transform .25s}
  .foot.open .tog .ico{transform:rotate(180deg)}
  .cnt{color:var(--dim);font-weight:500}
  .log{display:none;flex-direction:column;max-height:240px;overflow-y:auto;padding:0 14px;background:var(--sep)}
  .foot.open .log{display:flex}
  .msg{padding:9px 0;font-size:12.5px;background:var(--sep)}
  .msg:last-child{background:none}
  .msg.me{color:var(--k-question);font-weight:500}
  .msg.me::before{content:"› "}
  .qchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
  .chip:hover{color:var(--txt);border-color:var(--accent)}
  .inputbar{display:flex;gap:8px;padding:0 14px 12px;align-items:center}
  .inputbar input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--input);color:var(--txt);outline:none;font-size:13px}
  .inputbar input:focus{border-color:var(--accent)}
  .send{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .send:hover{background:var(--accent-h)}

  @media (max-width:1280px){
    .app{grid-template-columns:var(--ws,200px) 10px minmax(340px,1fr) 12px 210px}
    .filtros{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (max-width:980px){
    body{overflow:auto;height:auto}
    .app{grid-template-columns:1fr;height:auto;min-height:100vh}
    .side,.rz,.col,.sidecol{grid-column:1}
    .rz{display:none}
    .side-foot{display:none}
    .nav-list{flex-direction:row;overflow-x:auto;gap:6px}
    .group{display:none}
    .nav{width:auto;white-space:nowrap}
    .view{overflow:visible}
    .pg,.grow{flex:none}
    .grid2,.grid4,.qlist,.filtros,.seg{grid-template-columns:1fr}
    .blk-b>.rv{flex:none}
    .foot.open .log{max-height:40vh}
  }
  @media (prefers-reduced-motion:reduce){
    .rv,.rv.in{opacity:1!important;transform:none!important;transition:none!important}
  }

@media(max-width:720px){.filtros select,.inputbar input{font-size:16px}.sidecol{overflow:visible;height:auto}.cards{grid-template-columns:1fr}.seg{grid-template-columns:repeat(2,1fr)}.nav{padding:10px 12px}.qitem,.task{padding:12px 0}.btn{padding:9px 14px}.tog{padding:8px 12px}.side-foot{display:flex;padding:8px 0}}

const log=(h,who)=>{

function responder(q){
  abrir(true);
  log(esc(q),'me');
  const l=q.toLowerCase(), c=sel(), R=recsFor(c);
  let key, intro;
  if(/alerta|urgente/.test(l)){key='alerta';intro=`Você tem ${ALERTAS.length} alertas. O mais urgente é o prazo de inscrição.`;}
  else if(/combina|concurso|aberto|mg|priorizar/.test(l)){key='concurso';intro=`Pelo seu plano, ${CONC.find(x=>x.plano).org} tem a maior aderência.`;}
  else if(/prazo|inscri|data|fecha/.test(l)){key='prazo';intro='Este é o prazo que mais pesa agora.';}
  else if(/erro|errei|lacun|portugu|resumo|crase/.test(l)){key='erro';intro=`Sua menor média está em ${c.materias[c.acertos.indexOf(Math.min(...c.acertos))]}.`;}
  else if(/fonte|material|dica|videoaula|aula|desatualiz|vigente|confi|lei/.test(l)){key='fonte';intro='Materiais com origem e data verificadas. Itens substituídos ficam sinalizados.';}
  else if(/simulad|meta/.test(l)){key='simulado';intro='Após cada simulado, a revisão parte dos erros.';}
  else {key='plano';intro='Para hoje, este é o bloco mais útil.';}
  setTimeout(()=>{
    log(`${esc(intro)}${recHTML(R[key])}`,'bot');
    respostas++;
    document.getElementById('cnt').textContent=`(${respostas})`;
  },250);
}

const VIEWS={painel:vPainel,concursos:vConcursos,fontes:vFontes,estudo:vEstudo,plano:vPlano,simulados:vSimulados,alertas:vAlertas};

/* REVELAÇÃO E PARALAXE */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});

function stagger(root){
  root.querySelectorAll('.rv').forEach(el=>{
    const sibs=[...el.parentElement.children].filter(c=>c.classList.contains('rv'));
    el.style.setProperty('--d',(sibs.indexOf(el)*70+(el.classList.contains('blk')?0:90))+'ms');
  });
}
function reveal(root,anim){
  root.querySelectorAll('.rv').forEach(el=>{
    if(anim&&!REDUZ){ io.observe(el); }
    else { el.classList.add('still','in'); }
  });
}

const view=document.getElementById('view');
let raf=0;
function tick(){
  raf=0;
  const vr=view.getBoundingClientRect(), mid=vr.top+vr.height/2;
  const els=[...view.querySelectorAll('.blk.px')];
  const tg=els.map(el=>{const r=el.getBoundingClientRect();return Math.max(-3,Math.min(3,(mid-(r.top+r.height/2))*0.02));});
  let mv=false;
  els.forEach((el,i)=>{
    const s=i%2?-1:1, t=tg[i]*s, c=el._c||0;
    let n=c+(t-c)*0.12;
    if(Math.abs(t-n)<.02) n=t;
    if(n!==c) mv=true;
    el._c=n;
    el.style.translate=`0 ${n.toFixed(2)}px`;
  });
  if(mv) kick();
}
function kick(){ if(!REDUZ && !raf) raf=requestAnimationFrame(tick); }
view.addEventListener('scroll',kick,{passive:true});
window.addEventListener('resize',kick);

function renderSide(anim){
  const sc=document.getElementById('sidecol');
  sc.innerHTML=`<div class="blk-h">${ico('spark','sim')}Dados · ${esc(TITULOS[tab])}</div><div class="blk-sub">Indicadores da aba atual</div>
    <div class="blk-b">${KP(tab).map((k,i)=>`<div class="kpi rv"><div class="kpi-h">${ico(KPI_IC[i][0],KPI_IC[i][1])}<small>${esc(k[0])}</small></div><div class="val">${esc(k[1])}${k[2]?`<span>${esc(k[2])}</span>`:''}</div></div>`).join('')}</div>`;
  stagger(sc); reveal(sc,anim);
}

function render(anim=false){
  const y=view.scrollTop;
  view.innerHTML=VIEWS[tab]();
  view.scrollTop=y;
  view.querySelectorAll('.blk.px').forEach((b,i)=>{ b.style.setProperty('--ry',(i%2?56:32)+'px'); });
  stagger(view);
  reveal(view,anim);
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.tab===tab));
  view.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');
  renderSide(anim);
  renderQ();
  kick();
}
function go(t){ tab=t; render(true); }

/* LARGURA DO MENU */
(function(){
  const app=document.querySelector('.app');
  const DEF=200, lim=[160,320];
  const set=v=>{v=Math.max(lim[0],Math.min(lim[1],v));document.documentElement.style.setProperty('--ws',v+'px');return v;};
  let cur=DEF, drag=false;
  const h=document.querySelector('.rz');
  h.addEventListener('pointerdown',e=>{drag=true;h.setPointerCapture(e.pointerId);app.classList.add('dragging');e.preventDefault();});
  h.addEventListener('pointermove',e=>{ if(!drag) return; const r=app.getBoundingClientRect(); cur=set(e.clientX-r.left-12); });
  const end=()=>{drag=false;app.classList.remove('dragging');};
  h.addEventListener('pointerup',end);
  h.addEventListener('pointercancel',end);
  h.addEventListener('dblclick',()=>{cur=set(DEF);});
  h.addEventListener('keydown',e=>{
    const step=e.shiftKey?40:12;
    if(e.key==='ArrowLeft'){cur=set(cur-step);e.preventDefault();}
    if(e.key==='ArrowRight'){cur=set(cur+step);e.preventDefault();}
  });
  set(DEF);
})();
