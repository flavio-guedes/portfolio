<style>

aside{display:flex;flex-direction:column;gap:4px;padding:14px 10px;border-radius:20px;min-height:0;overflow-y:auto}

aside::-webkit-scrollbar-thumb{background:rgba(0,191,255,.15);border-radius:5px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,191,255,.5),rgba(124,140,255,.42));border:1px solid var(--line);color:#DFF6FF;flex-shrink:0}

main::-webkit-scrollbar-thumb{background:rgba(0,191,255,.2);border-radius:8px}
.demo-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:10px;letter-spacing:.06em;color:var(--amber);padding:0 2px}
.radar-strip{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:11px;cursor:pointer;transition:.2s;flex-wrap:wrap;font-size:11.5px}
.radar-strip .rlab{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700;flex-shrink:0}
.radar-strip .ritem{display:flex;align-items:center;gap:5px}
.radar-strip .ritem i{width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.radar-strip .ritem b{color:var(--c);font-weight:600}
.radar-strip .rmore{font-size:10px;color:var(--cyan);opacity:.7;margin-left:auto}
.front-head{display:flex;flex-direction:column;gap:2px;padding:0 2px}

.front-head .fpurp{color:var(--dim);font-size:12px}
.kpis-c{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi-c{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;border-left:2px solid var(--c);cursor:pointer;transition:.2s;text-align:left;width:100%}
.kpi-c .kcol{display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi-c .kl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;white-space:nowrap}
.kpi-c .kv{font-size:20px;font-weight:700;color:var(--c);line-height:1.05}
.kpi-c .ka{font-size:10px;color:var(--c);opacity:.7;white-space:nowrap}

.alert-line{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;margin-bottom:5px;overflow:hidden;transition:.2s;cursor:pointer;border-left:2px solid var(--c)}
.alert-line .al-badge{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;padding:2px 8px;white-space:nowrap;background:color-mix(in srgb,var(--c) 10%,transparent);flex-shrink:0}

.alert-line .al-toggle{font-size:10px;color:var(--cyan);flex-shrink:0;padding:2px 6px;border-radius:5px;background:rgba(0,191,255,.08);white-space:nowrap}

.alert-sub{padding:6px 12px 10px 24px;border-radius:0 0 11px 11px;margin:-8px 0 5px;border-left:2px solid var(--c);border-top:none;background:linear-gradient(180deg,rgba(14,32,56,.22),rgba(7,18,36,.16))}

.pan-card .pc-s b{color:var(--c);font-weight:600}
</style>
</head>

function chatInitial(){chatHistory.length=0;chatHistory.push({r:'b',html:`<p><b>Assistente EPQ · modo local.</b> Consulto dados desta demonstração.</p><p>Clique em um indicador, alerta ou pergunta.</p>`,followups:['O que precisa da minha atenção hoje?','Quem está inadimplente?','Qual campanha apresenta o menor CPL?','Como está o RH?']});}
function chatDraw(){const log=el('log');log.innerHTML=chatHistory.map(m=>{const fu=m.followups&&m.followups.length?`<div class="followups"><span class="flab">Investigar mais</span><div class="fgrid">${m.followups.map(f=>`<button data-followup="${esc(f)}">${esc(f)}</button>`).join('')}</div></div>`:'';return`<div class="bub ${m.r}">${m.html}${fu}</div>`;}).join('');log.scrollTop=log.scrollHeight;}
function openChat(){el('chat').classList.add('open')}
function pushUser(q){chatHistory.push({r:'u',html:esc(q),followups:[]});chatDraw()}
function pushBot(html,fu){chatHistory.push({r:'b',html,followups:fu||[]});chatDraw()}
const S=(t,b)=>`<h4>${esc(t)}</h4>${b}`;
const UL=items=>`<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const LIM=m=>`<span class="bnote">Limitação: ${esc(m)}</span>`;
function findEntity(q){const ql=q.toLowerCase();const tries=[{list:L(),label:l=>l.nome,type:'lead'},{list:A(),label:a=>a.nome,type:'aluno'},{list:T(),label:t=>t.concurso,type:'turma'},{list:C(),label:c=>c.nome,type:'campanha'},{list:FN(),label:f=>f.aluno,type:'financeiro'}];
for(const t of tries)for(const i of t.list){const k=t.label(i).toLowerCase();if(k&&ql.includes(k))return{type:t.type,item:i}}return null;}
function askAssistant(qRaw){const q=qRaw.toLowerCase();const k=calc();const ent=findEntity(qRaw);
if(ent&&ent.type==='lead'){const l=ent.item;return{html:S('Resumo',`<p><b>${esc(l.nome)}</b> — ${esc(l.etapa)} · ${esc(l.concurso)} · resp. ${esc(l.responsavel)}.</p>`)+S('Fatos',UL([`Últ. contato: ${dt(l.ultimoContato)} (${daysAgo(l.ultimoContato)}d)`,`Objeções: ${l.objecoes.length?esc(l.objecoes.join(', ')):'—'}`]))+S('Próximo passo',`<p>${esc(l.proximaAcao||'Contato.')}</p>`),followups:['Quais leads estão sem retorno?','Quais são as objeções mais frequentes?']};}
if(ent&&ent.type==='turma'){const t=ent.item;return{html:S('Resumo',`<p>Turma <b>${esc(t.concurso)}</b> (${esc(t.regiao)}) — "${esc(t.recomendacao)}" · conf ${Math.round(t.confianca*100)}%.</p>`)+S('Fatos',UL([`${t.leads} leads · cap ${t.capacidade}`,`Prof: ${esc(t.professor||'a definir')} · prazo ${dt(t.prazo)}`])),followups:['Que evidências faltam?']};}
if(ent&&ent.type==='campanha'){const c=ent.item;const cpl=c.leads?c.investimento/c.leads:0;return{html:S('Resumo',`<p>Campanha <b>${esc(c.nome)}</b> — CPL R$ ${cpl.toFixed(2)}.</p>`)+S('Fatos',UL([`R$ ${c.investimento} · ${c.leads} leads · ${c.matriculas} matrículas`]))+LIM('Atribuição estimada.'),followups:['Como comparar com outras campanhas?']};}
if(ent&&ent.type==='aluno'){const a=ent.item;return{html:S('Resumo',`<p>Aluno <b>${esc(a.nome)}</b> (${esc(a.turma)}) — ${esc(a.risco)} · ${esc(a.situacao)}.</p>`)+S('Sinal',`<p>${esc(a.sinal)}</p>`)+S('Recomendação',`<p>${esc(a.proximaAcao)}</p>`),followups:['Quais outros alunos estão em risco?']};}
if(ent&&ent.type==='financeiro'){const f=ent.item;return{html:S('Resumo',`<p><b>${esc(f.aluno)}</b> — ${esc(f.turma)} · R$ ${f.valor} · ${esc(f.status)}.</p>`)+S('Fatos',UL([`Vencimento: ${dt(f.vencimento)}`,`Dias em atraso: ${f.diasAtraso>0?f.diasAtraso:0}`])),followups:['Quem mais está inadimplente?']};}
if(/atenção hoje|o que precisa|gargalo/i.test(q)){const al=AL().filter(a=>!a.lido&&a.tipo!=='OK').sort((a,b)=>({P0:0,P1:1,P2:2}[a.tipo]-{P0:0,P1:1,P2:2}[b.tipo]));return{html:S('Resumo',`<p>Há <b>${al.length}</b> alertas abertos.</p>`)+S('Top sinais',UL(al.slice(0,6).map(a=>`<b>${esc(a.tipo)}</b> · ${esc(a.grupo)} · ${esc(a.texto)}`)))+S('Recomendação',`<p>Atacar P0 primeiro.</p>`),followups:['Quais P0 estão abertos?','Quais leads estão sem retorno?']};}
if(/inadimplência|inadimplente|vencido/i.test(q)){const v=FN().filter(x=>x.status==='vencido').sort((a,b)=>b.diasAtraso-a.diasAtraso);return{html:S('Resumo',`<p><b>${v.length}</b> mensalidades vencidas — R$ ${v.reduce((s,x)=>s+x.valor,0).toLocaleString('pt-BR')}.</p>`)+UL(v.map(x=>`<b>${esc(x.aluno)}</b> — R$ ${x.valor} · ${x.diasAtraso}d atrás`))+S('Recomendação',`<p>Começar pelos +30d.</p>`),followups:['Qual a situação do fluxo de caixa?']};}
if(/fluxo de caixa|receita|contas.*pagar/i.test(q)){const fn=FN(),ct=FT();const venc=fn.filter(x=>x.status==='vencido').reduce((s,x)=>s+x.valor,0);const aPag=ct.filter(x=>x.status==='a_pagar').reduce((s,x)=>s+x.valor,0);return{html:S('Resumo',`<p>Vencidos: <b>R$ ${venc.toLocaleString('pt-BR')}</b> · Contas a pagar: <b>R$ ${aPag.toLocaleString('pt-BR')}</b>.</p>`),followups:['Quem está inadimplente?']};}
if(/sobrecarreg|quem está no limite/i.test(q)){const rh=RH().filter(x=>x.status==='sobrecarga'||x.status==='atencao');return{html:S('Resumo',`<p><b>${rh.length}</b> pessoa(s) em atenção.</p>`)+UL(rh.map(r=>`<b>${esc(r.nome)}</b> (${esc(r.cargo)}) — ${esc(r.alerta)}`)),followups:['Como está o plano de carreira?']};}
if(/plano de carreira|benefíc/i.test(q)){const b=RHB();return{html:S('Resumo',`<p>${b.length} benefícios.</p>`)+UL(b.map(x=>`<b>${esc(x.item)}</b> — ${esc(x.status)}`)),followups:['Quem está sobrecarregado?']};}
if(/estrutura|equipament|reparo/i.test(q)){const es=ES();return{html:S('Resumo',`<p><b>${es.length}</b> itens com pendência.</p>`)+UL(es.slice(0,6).map(x=>`<b>${esc(x.item)}</b> — ${esc(x.problema)}`)),followups:['Qual o impacto no aluno?']};}
if(/serviço.*fora|backup|infra/i.test(q)){const ti=TI();return{html:S('Resumo',`<p>${ti.filter(x=>x.status==='online').length}/${ti.length} serviços online.</p>`)+UL(ti.map(x=>`<b>${esc(x.servico)}</b> — ${esc(x.status)}`)),followups:['Último backup rodou?']};}
if(/agenda.*hoje|o que tenho hoje/i.test(q)){const ag=AG().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).slice(0,6);return{html:S('Resumo',`<p>Próximos compromissos:</p>`)+UL(ag.map(x=>`<b>${dt(x.data)} ${x.hora}</b> — ${esc(x.titulo)}`)),followups:['O que está sem confirmação?']};}
if(/unidade|filial/i.test(q)){const f=FIL();return{html:S('Resumo',`<p><b>${f.length}</b> unidades.</p>`)+UL(f.map(x=>`<b>${esc(x.nome)}</b> — ${x.alunos} alunos · ${esc(x.status)}`)),followups:['Qual filial é mais rentável?']};}
if(/priorizar.*lead|leads.*hoje/i.test(q)){const p=L().filter(l=>l.prioridade==='alta'&&l.etapa!=='Perdido'&&l.etapa!=='Matrícula confirmada');return{html:S('Resumo',`<p><b>${p.length}</b> leads alta prioridade.</p>`)+UL(p.map(l=>`<b>${esc(l.nome)}</b> — ${esc(l.concurso)}, ${esc(l.etapa)}`)),followups:['Quais leads estão sem retorno?']};}
if(/sem retorno|24h/i.test(q)){const l=L().filter(x=>x.etapa!=='Perdido'&&x.etapa!=='Matrícula confirmada'&&daysAgo(x.ultimoContato)>1).sort((a,b)=>daysAgo(b.ultimoContato)-daysAgo(a.ultimoContato));return{html:S('Resumo',`<p><b>${l.length}</b> lead(s) sem retorno +24h.</p>`)+UL(l.slice(0,8).map(x=>`<b>${esc(x.nome)}</b> — ${daysAgo(x.ultimoContato)}d`)),followups:['Quais estão próximos de fechar?']};}
if(/menor cpl/i.test(q)){const c=C().filter(x=>x.leads>0).map(x=>({x,cpl:x.investimento/x.leads})).sort((a,b)=>a.cpl-b.cpl);return{html:S('Resumo',`<p>Menor CPL: <b>${esc(c[0]?.x.nome||'—')}</b> — R$ ${(c[0]?.cpl||0).toFixed(2)}.</p>`)+S('Comparativo',UL(c.slice(0,5).map(v=>`${esc(v.x.nome)}: R$ ${v.cpl.toFixed(2)}`))),followups:['Onde investimos sem retorno?']};}
if(/investindo sem|sem.*matrícul/i.test(q)){const s=C().filter(x=>x.investimento>0&&x.matriculas===0);return{html:S('Resumo',`<p><b>${s.length}</b> campanha(s) sem matrícula — R$ ${k.investSemMat.toLocaleString('pt-BR')}.</p>`)+UL(s.map(x=>`<b>${esc(x.nome)}</b> — R$ ${x.investimento}`)),followups:['Qual campanha tem menor CPL?']};}
if(/aluno.*acompanhament/i.test(q)){const a=A().filter(x=>x.situacao!=='resolvido'&&x.risco!=='OK');return{html:S('Resumo',`<p><b>${a.length}</b> aluno(s) em atenção.</p>`)+UL(a.slice(0,8).map(x=>`<b>${esc(x.nome)}</b> — ${esc(x.sinal)}`)),followups:['Quem teve faltas consecutivas?']};}
if(/melhor oportunidade|turma.*melhor/i.test(q)){const t=T().sort((a,b)=>b.confianca-a.confianca)[0];return{html:S('Resumo',`<p>Maior confiança: <b>${esc(t.concurso)}</b> — ${Math.round(t.confianca*100)}%.</p>`)+S('Próximo passo',`<p>${esc(t.proximaAcao)}</p>`),followups:['Que evidências faltam?']};}
return{html:S('Resumo','<p>Não identifiquei consulta específica.</p>')+S('Sugestões',UL(['O que precisa da minha atenção hoje?','Quem está inadimplente?','Qual campanha apresenta o menor CPL?','Quem está sobrecarregado no RH?'])),followups:[]};}
function render(){renderNav();if(state.detail)el('main').innerHTML=viewRecords(state.detail.front);else el('main').innerHTML=(VIEWS[state.view]||viewPrincipal)();el('main').scrollTop=0;}
document.addEventListener('click',e=>{
const nav=e.target.closest('[data-r]');if(nav){state.view=nav.dataset.r;state.detail=null;state.selRecord=null;render();return}
const rec=e.target.closest('[data-records-front]');if(rec){state.detail={front:rec.dataset.recordsFront};state.selRecord=null;render();return}
if(e.target.closest('[data-back]')){state.detail=null;state.selRecord=null;render();return}
const tr=e.target.closest('tr[data-rec]');if(tr){state.selRecord=tr.dataset.rec;render();return}
const alertLine=e.target.closest('[data-alert]');if(alertLine&&!e.target.closest('button')){const id=alertLine.dataset.alert;state.expanded[id]=!state.expanded[id];render();return;}
const ask=e.target.closest('[data-ask]');if(ask){submitQuestion(ask.dataset.ask);return}
const fu=e.target.closest('[data-followup]');if(fu){submitQuestion(fu.dataset.followup);return}
const qt=e.target.closest('[data-q-toggle]');if(qt){const f=qt.dataset.qToggle;state.qExpanded[f]=!state.qExpanded[f];render();return}
const radar=e.target.closest('[data-radar]');if(radar){submitQuestion('Mostre um panorama do radar.');return}
if(e.target.closest('[data-chat="close"]')){el('chat').classList.remove('open');return}
if(e.target.closest('[data-chat="clear"]')){chatInitial();chatDraw();return}
});
el('cf').addEventListener('submit',e=>{e.preventDefault();const inp=el('ci');const q=inp.value.trim();if(!q)return;inp.value='';submitQuestion(q);});
el('chat').addEventListener('click',e=>{if(!el('chat').classList.contains('open')&&!e.target.closest('button'))openChat();});
async function submitQuestion(q){if(!q)return;openChat();pushUser(q);setTimeout(()=>{const a=askAssistant(q);pushBot(a.html,a.followups);},160);}
chatInitial();render();chatDraw();
</script>
</body>
</html>
