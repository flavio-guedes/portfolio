<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Ação — Foco em Resultados</title>
<style>
  /* ── TOKENS ── */
  :root {
    --bg:         #0d1117;
    --surface:    #161b22;
    --surface2:   #1c2430;
    --border:     #2a3441;
    --border2:    #1e2d3d;
    --text:       #e6edf3;
    --muted:      #7d8590;
    --green:      #3fb950;
    --green-dim:  #1a3a22;
    --yellow:     #d29922;
    --yellow-dim: #3a2c10;
    --red:        #f85149;
    --red-dim:    #3a1414;
    --blue:       #58a6ff;
    --blue-dim:   #0d2a4a;
    --purple:     #a371f7;
    --orange:     #f0883e;
    --tier1:      #3fb950;
    --tier2:      #58a6ff;
    --tier3:      #d29922;
    --tier4:      #f0883e;
    --tier5:      #f85149;
    --tier6:      #7d8590;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER BANNER ── */
  .header-banner {
    background: linear-gradient(135deg, #0d1117 0%, #0f1e2e 40%, #091624 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 16px;
    position: relative;
    overflow: hidden;
  }

  .header-banner::before {
    content: '';
    position: absolute;
    top: -40px; right: -60px;
    width: 300px; height: 180px;
    background: radial-gradient(ellipse, rgba(63,185,80,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--green), #2ea043);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 1.2;
  }

  .brand-text p {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 1px;
  }

  .brand-text p span {
    color: var(--green);
    font-weight: 600;
  }

  .header-tagline {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    background: rgba(63,185,80,0.07);
    border: 1px solid rgba(63,185,80,0.15);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* ── KPI CARDS ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 12px 28px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s;
    cursor: default;
  }

  .kpi-card:hover { border-color: var(--border2); }

  .kpi-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .kpi-icon.total   { background: rgba(88,166,255,0.12); }
  .kpi-icon.alto    { background: rgba(63,185,80,0.12); }
  .kpi-icon.nao     { background: rgba(210,153,34,0.12); }
  .kpi-icon.revisao { background: rgba(163,113,247,0.12); }

  .kpi-num {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .kpi-num.total   { color: var(--blue); }
  .kpi-num.alto    { color: var(--green); }
  .kpi-num.nao     { color: var(--yellow); }
  .kpi-num.revisao { color: var(--purple); }

  .kpi-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  /* ── TABS ── */
  .tabs-bar {
    display: flex;
    gap: 0;
    padding: 0 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--green);
    border-bottom-color: var(--green);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── FILTERS / TOOLBAR ── */
  .toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 28px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .toolbar-search {
    flex: 1;
    min-width: 200px;
    max-width: 320px;
    position: relative;
  }

  .toolbar-search input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 12px 7px 32px;
    outline: none;
    transition: border-color 0.15s;
  }

  .toolbar-search input:focus { border-color: var(--blue); }

  .toolbar-search::before {
    content: '🔍';
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    pointer-events: none;
  }

  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 10px;
    cursor: pointer;
    outline: none;
  }

  .filter-select:focus { border-color: var(--blue); }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface2); border-color: var(--muted); }

  .btn-green {
    background: var(--green-dim);
    border-color: rgba(63,185,80,0.3);
    color: var(--green);
  }

  .btn-green:hover { background: rgba(63,185,80,0.2); }

  .toolbar-right { margin-left: auto; display: flex; gap: 6px; }

  .count-label {
    font-size: 12px;
    color: var(--muted);
    padding: 7px 0;
    white-space: nowrap;
  }

  /* ── TABLE ── */
  .table-wrap {
    overflow-x: auto;
    padding: 0 28px 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  thead th:hover { color: var(--text); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }

  tbody tr:hover { background: var(--surface); }
  tbody tr.expanded { background: var(--surface); }

  tbody td {
    padding: 10px 10px;
    vertical-align: middle;
  }

  .contact-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }

  .contact-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  /* ── BADGES ── */
  .tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }

  .tier-1 { background: rgba(63,185,80,0.15);  color: var(--tier1); border: 1px solid rgba(63,185,80,0.25); }
  .tier-2 { background: rgba(88,166,255,0.15); color: var(--tier2); border: 1px solid rgba(88,166,255,0.25); }
  .tier-3 { background: rgba(210,153,34,0.15); color: var(--tier3); border: 1px solid rgba(210,153,34,0.25); }
  .tier-4 { background: rgba(240,136,62,0.15); color: var(--tier4); border: 1px solid rgba(240,136,62,0.25); }
  .tier-5 { background: rgba(248,81,73,0.15);  color: var(--tier5); border: 1px solid rgba(248,81,73,0.25); }
  .tier-6 { background: rgba(125,133,144,0.12); color: var(--tier6); border: 1px solid rgba(125,133,144,0.2); }

  .score-pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    font-family: var(--mono);
    padding: 3px 8px;
    border-radius: 5px;
    min-width: 36px;
    text-align: center;
  }

  .score-high   { background: rgba(63,185,80,0.15); color: var(--green); }
  .score-mid    { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .score-low    { background: rgba(248,81,73,0.12); color: var(--red); }

  .prio-badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
    white-space: nowrap;
  }

  .prio-alta   { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(63,185,80,0.25); }
  .prio-media  { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(210,153,34,0.25); }
  .prio-baixa  { background: rgba(125,133,144,0.1); color: var(--muted); border: 1px solid var(--border); }

  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    flex-shrink: 0;
  }

  .status-dot.green  { background: var(--green); box-shadow: 0 0 4px var(--green); }
  .status-dot.yellow { background: var(--yellow); box-shadow: 0 0 4px var(--yellow); }
  .status-dot.gray   { background: var(--muted); }

  /* ── ACTION BUTTONS (table inline) ── */
  .action-btns {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
  }

  .act-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.12s;
    text-decoration: none;
    color: var(--text);
  }

  .act-btn:hover { background: var(--surface2); transform: scale(1.1); }
  .act-btn.email:hover  { border-color: var(--blue); color: var(--blue); }
  .act-btn.whats:hover  { border-color: var(--green); color: var(--green); }
  .act-btn.linkedin:hover { border-color: #0a66c2; color: #0a66c2; }

  /* ── EXPANDED ROW ── */
  .expand-row td {
    padding: 0;
    border-bottom: 1px solid var(--border);
  }

  .expand-panel {
    background: var(--surface2);
    padding: 16px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  .expand-section h4 {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .expand-detail {
    font-size: 12px;
    color: var(--text);
    line-height: 1.7;
  }

  .expand-detail strong {
    color: var(--muted);
    font-weight: 500;
    display: inline-block;
    min-width: 100px;
  }

  .nota-quick {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .nota-quick input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
  }

  .nota-quick input:focus { border-color: var(--blue); }

  .nota-quick button {
    background: var(--blue-dim);
    border: 1px solid rgba(88,166,255,0.3);
    border-radius: 6px;
    color: var(--blue);
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: var(--font);
  }

  /* ── PAGINATION ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 28px;
    border-top: 1px solid var(--border);
  }

  .page-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .page-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .page-btn.current { background: var(--blue-dim); border-color: rgba(88,166,255,0.4); color: var(--blue); }

  .page-info {
    font-size: 12px;
    color: var(--muted);
    padding: 0 8px;
  }

  /* ── REVISÃO TAB ── */
  .review-list {
    padding: 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .review-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--yellow);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .review-card.suspect { border-left-color: var(--red); }

  .review-info { flex: 1; min-width: 0; }
  .review-name { font-weight: 600; font-size: 13px; }
  .review-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .review-motivo {
    font-size: 11px;
    margin-top: 5px;
    background: var(--yellow-dim);
    color: var(--yellow);
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
  }

  .review-motivo.red { background: var(--red-dim); color: var(--red); }

  .review-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .rev-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid;
    font-family: var(--font);
    transition: all 0.12s;
  }

  .rev-btn.confirm { background: var(--green-dim); border-color: rgba(63,185,80,0.3); color: var(--green); }
  .rev-btn.discard { background: var(--red-dim); border-color: rgba(248,81,73,0.3); color: var(--red); }
  .rev-btn.mark    { background: var(--blue-dim); border-color: rgba(88,166,255,0.3); color: var(--blue); }

  /* ── FONTES TAB ── */
  .fonte-grid {
    padding: 16px 28px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .fonte-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }

  .fonte-card:hover { border-color: var(--blue); transform: translateY(-1px); }
  .fonte-card.active-source { border-color: var(--green); }

  .fonte-icon { font-size: 24px; margin-bottom: 10px; }
  .fonte-name { font-weight: 700; font-size: 14px; }
  .fonte-count { font-size: 28px; font-weight: 800; color: var(--blue); margin: 6px 0 2px; }
  .fonte-pct { font-size: 12px; color: var(--muted); }

  .fonte-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .fonte-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .fonte-detail {
    padding: 0 28px 20px;
    display: none;
  }

  .fonte-detail.visible { display: block; }
  .fonte-detail h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); }

  /* ── DOMÍNIOS TAB ── */
  .dom-toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 28px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .dom-toolbar label { font-size: 12px; color: var(--muted); }

  .dom-toolbar input[type="number"] {
    width: 70px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 6px 8px;
    outline: none;
    font-family: var(--mono);
  }

  /* ── TIER DISTRIBUTION ── */
  .tier-dist {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .tier-dot {
    height: 16px;
    border-radius: 3px;
    min-width: 4px;
    transition: width 0.2s;
  }

  /* ── COPY TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    display: none;
    z-index: 9999;
    animation: none;
  }

  #toast.show {
    display: flex;
    align-items: center;
    gap: 6px;
    animation: fadeInOut 2s forwards;
  }

  @keyframes fadeInOut {
    0%   { opacity: 0; transform: translateY(10px); }
    15%  { opacity: 1; transform: translateY(0); }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ── MESSAGES TAB ── */
  .msg-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin: 12px 28px;
  }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .msg-group-name {
    font-weight: 700;
    font-size: 14px;
  }

  .msg-meta {
    font-size: 11px;
    color: var(--muted);
  }

  .msg-template {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    color: var(--text);
    margin: 10px 0;
    white-space: pre-wrap;
  }

  .msg-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .msg-row:last-child { border-bottom: none; }
  .msg-name { font-weight: 600; font-size: 13px; min-width: 180px; }
  .msg-email { font-family: var(--mono); font-size: 12px; color: var(--text); word-break: break-all; }

  .msg-actions {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }

  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }

  .copy-btn:hover { border-color: var(--green); color: var(--green); }

  /* ── SEQUÊNCIAS TAB ── */
  .seq-step {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .seq-step-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .seq-step-title {
    font-weight: 700;
    font-size: 13px;
  }

  .seq-message {
    font-size: 13px;
    color: var(--text);
    white-space: pre-wrap;
  }

  .seq-steps {
    margin-top: 8px;
  }

  /* ── FOLLOW-UPS TAB ── */
  .fu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin: 12px 28px;
  }

  .fu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

// ── HELPERS ──
function needsReview(c) {
  return !c.cargo || c.score === 0 || (c.tier <= 2 && c.score_composto < 30);
}

function scoreClass(s) {
  if (s >= 75) return 'score-high';
  if (s >= 50) return 'score-mid';
  return 'score-low';
}

function prioClass(p) {
  if (p === 'Alta') return 'prio-alta';
  if (p === 'Média') return 'prio-media';
  return 'prio-baixa';
}

function tierClass(t) { return `tier-${t}`; }

function contatadoStatus(c) {
  if (c.data_contato && c.data_contato !== '') {
    return `<span class="status-dot green"></span><span style="font-size:11px;color:var(--green)">Contatado</span>`;
  }
  return `<span class="status-dot yellow"></span><span style="font-size:11px;color:var(--yellow)">Não contatado</span>`;
}

function formatDate(d) {
  if (!d) return '—';
  const parts = d.split('-');
  if (parts.length !== 3) return d;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => toast(`${label} copiado!`));
}

function toast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.className = 'show';
  setTimeout(() => { el.className = ''; }, 2000);
}

function populateFonteFilter() {
  const fontes = [...new Set(CONTACTS.map(c => c.fonte))].sort();
  const sel = document.getElementById('fil-fonte');
  fontes.forEach(f => {
    const o = document.createElement('option');
    o.value = f; o.textContent = f;
    sel.appendChild(o);
  });
}

function closeDrawer(){ $('drawer-overlay')?.classList.remove('open'); $('drawer')?.classList.remove('open'); }
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const tabs = ['top','revisao','fontes','dominios','mensagens','sequencias','followups'];
  const idx = tabs.indexOf(tab);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function sortTable(field) {
  if (sortField === field) sortDir *= -1;
  else { sortField = field; sortDir = -1; }
  renderTop();
}

// ── TAB TOP AÇÃO ──
function renderTop() {
  const search = document.getElementById('search-top').value.toLowerCase();
  const tier   = document.getElementById('fil-tier').value;
  const prio   = document.getElementById('fil-prio').value;
  const fonte  = document.getElementById('fil-fonte').value;
  const status = document.getElementById('fil-status').value;

  filtered = CONTACTS.filter(c => {
    if (search && !(
      c.nome.toLowerCase().includes(search) ||
      c.email.toLowerCase().includes(search) ||
      c.empresa.toLowerCase().includes(search)
    )) return false;
    if (tier  && String(c.tier) !== tier) return false;
    if (prio  && c.prioridade !== prio)   return false;
    if (fonte && c.fonte !== fonte)        return false;
    if (status === 'nao' && c.data_contato) return false;
    if (status === 'sim' && !c.data_contato) return false;
    return true;
  });

  filtered.sort((a, b) => {
    const av = a[sortField] ?? '';
    const bv = b[sortField] ?? '';
    if (typeof av === 'number') return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });

  const totalFiltered = filtered.length;
  document.getElementById('count-label').textContent = `${totalFiltered} contato${totalFiltered !== 1 ? 's' : ''}`;

  const totalPages = Math.max(1, Math.ceil(totalFiltered / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = 1;
  const pageData = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const tbody = document.getElementById('tbody-top');
  if (pageData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="es-icon">🔎</div><p>Nenhum contato encontrado com esses filtros.</p></div></td></tr>`;
  } else {
    tbody.innerHTML = pageData.map((c, i) => buildContactRow(c, i)).join('');
  }

  renderPagination(totalPages);
  expandedRow = null;
}

function buildContactRow(c, i) {
  const liAct = c.linkedin_url
    ? `<a class="act-btn linkedin" href="${c.linkedin_url}" target="_blank" title="Abrir LinkedIn" onclick="event.stopPropagation()">in</a>`
    : `<button class="act-btn linkedin" disabled title="LinkedIn não informado" style="opacity:0.3;cursor:not-allowed">in</button>`;

  const emailAct = c.email
    ? `<button class="act-btn email" onclick="copyText('${c.email}','E-mail');event.stopPropagation()" title="Copiar e-mail">✉</button>`
    : `<button class="act-btn email" disabled style="opacity:0.3;cursor:not-allowed" title="E-mail não informado">✉</button>`;

  const waAct = c.whatsapp
    ? `<a class="act-btn whats" href="https://wa.me/${c.whatsapp}" target="_blank" onclick="event.stopPropagation()" title="Abrir WhatsApp">💬</a>`
    : `<button class="act-btn whats" disabled style="opacity:0.3;cursor:not-allowed" title="WhatsApp não informado">💬</button>`;

  return `
    <tr onclick="toggleExpand(this, ${JSON.stringify(c).split('"').join('&quot;')})">
      <td>
        <div class="contact-name">${c.nome}</div>
        <div class="contact-sub">${c.cargo || '<span style="color:var(--red);font-size:10px">⚠ Sem cargo</span>'}</div>
      </td>
      <td><span class="nowrap">${c.empresa}</span></td>
      <td><span class="tier-badge ${tierClass(c.tier)}">T${c.tier}</span></td>
      <td><span class="score-pill ${scoreClass(c.score_composto)}">${c.score_composto}</span></td>
      <td><span class="prio-badge ${prioClass(c.prioridade)}">${c.prioridade}</span></td>
      <td><div class="flex-center gap-4">${contatadoStatus(c)}</div></td>
      <td style="max-width:180px;font-size:12px;color:var(--text)">${c.acao_sugerida || '—'}</td>
      <td>
        <div class="action-btns">
          ${emailAct}${waAct}${liAct}
        </div>
      </td>
    </tr>`;
}

function toggleExpand(row, c) {
  // Se já existe expand, remove
  const next = row.nextSibling;
  if (next && next.classList && next.classList.contains('expand-row')) {
    next.remove();
    row.classList.remove('expanded');
    expandedRow = null;
    return;
  }
  // Remove qualquer outro expandido
  document.querySelectorAll('.expand-row').forEach(r => r.remove());
  document.querySelectorAll('tbody tr.expanded').forEach(r => r.classList.remove('expanded'));

  row.classList.add('expanded');
  expandedRow = c.nome;

  const div = document.createElement('tr');
  div.className = 'expand-row';
  div.innerHTML = `<td colspan="8">
    <div class="expand-panel">
      <div class="expand-section">

        </div>

// Notas em memória (localStorage)
function salvarNota(email) {
  const val = document.getElementById(`nota-${email}`).value.trim();
  if (!val) return;
  const notas = JSON.parse(localStorage.getItem('crm_notas') || '{}');
  notas[email] = { texto: val, data: new Date().toLocaleDateString('pt-BR') };
  localStorage.setItem('crm_notas', JSON.stringify(notas));
  toast('Nota salva!');
  document.getElementById(`nota-${email}`).value = '';
  const div = document.getElementById(`nota-saved-${email}`);
  if (div) div.innerHTML = notaHTML(notas[email]);
}

function getNota(email) {
  const notas = JSON.parse(localStorage.getItem('crm_notas') || '{}');
  if (!notas[email]) return `<div id="nota-saved-${email}"></div>`;
  return `<div id="nota-saved-${email}">${notaHTML(notas[email])}</div>`;
}

function notaHTML(n) {
  return `<div style="margin-top:8px;padding:8px;background:var(--blue-dim);border:1px solid rgba(88,166,255,0.2);border-radius:6px;font-size:12px;color:var(--blue)">📝 ${n.texto} <span style="color:var(--muted);font-size:11px">(${n.data})</span></div>`;
}

// ── PAGINAÇÃO ──
function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹ Anterior</button>`;
  
  const start = Math.max(1, currentPage - 2);
  const end   = Math.min(totalPages, currentPage + 2);

  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button><span class="page-info">…</span>`;
  for (let p = start; p <= end; p++) {
    html += `<button class="page-btn ${p === currentPage ? 'current' : ''}" onclick="goPage(${p})">${p}</button>`;
  }
  if (end < totalPages) html += `<span class="page-info">…</span><button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;

  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>Próxima ›</button>`;
  html += `<span class="page-info">${filtered.length} contatos</span>`;

  el.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderTop();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function adaptTemplate(t, c) {
  let msg = t.base || '';
  const nome = c?.nome ? c.nome.split(' ').slice(0,2).join(' ') : '';
  const empresa = c?.empresa || 'sua empresa';
  const cargo = c?.cargo || '';
  const last = (c?.data_contato || c?.ultima_interacao || '').toString();
  const history = INTERACTIONS.filter(i => activeContactKey && i.contactKey === activeContactKey);
  const ultima = history.length ? history[history.length-1].text : '';
  const contexto = history.map(i => i.text).join(' | ') || last;
  msg = msg.replace(/\{\{nome\}\}/gi, nome).replace(/\{\{empresa\}\}/gi, empresa).replace(/\{\{cargo\}\}/gi, cargo).replace(/\{\{ultima_interacao\}\}/gi, dmy(last)).replace(/\{\{contexto\}\}/gi, contexto).replace(/\{\{objetivo\}\}/gi, t.objetivo).replace(/\{\{cta\}\}/gi, t.cta);
  return msg;
}

function contextBlock(c) {
  if (!c) return '';
  const parts = [];
  if (c.cargo) parts.push(`Cargo: ${c.cargo}`);
  if (c.empresa) parts.push(`Empresa: ${c.empresa}`);
  if (c.categoria) parts.push(`Categoria: ${c.categoria}`);
  if (c.trecho) parts.push(`Contexto anterior: "${c.trecho}"`);
  if (INTERACTIONS.filter(i => activeContactKey && i.contactKey === activeContactKey).length) parts.push(`Há histórico de ${INTERACTIONS.filter(i => activeContactKey && i.contactKey === activeContactKey).length} interação(ões).`);
  return parts.join('\n');
}

function getSequenceEmails(key) {
  const seq = SEQUENCES.find(s => s.key === key);
  if (!seq) return [];
  if (seq.emails && seq.emails.length) {
    const seen = new Set();
    const out = [];
    seq.emails.forEach(e => {
      const v = String(e).trim().toLowerCase();
      if (!v || seen.has(v)) return;
      seen.add(v);
      out.push(v);
    });
    return out;
  }

  const seen = new Set();
  const emails = [];
  const addIfNew = (email) => {
    if (!email) return;
    const e = String(email).trim().toLowerCase();
    if (!e || seen.has(e)) return;
    seen.add(e);
    emails.push(e);
  };
  CONTACTS.forEach(c => {
    const match = seq.key === 'tier1' ? c.tier === 1 :
      seq.key === 'tier2' ? c.tier === 2 :
      seq.key === 'tier3' ? c.tier === 3 :
      seq.key === 'tier4' ? c.tier === 4 :
      seq.key === 'tier5' ? c.tier === 5 :
      seq.key === 'tier6' ? c.tier === 6 :
      c.email;
    if (match) addIfNew(c.email);
  });
  return emails;
}

function copySequence(groupKey) {
  const seq = SEQUENCES.find(s => s.key === groupKey);
  if (!seq || !seq.steps.length) { toast('Sequência não encontrada'); return; }

  const text = seq.steps.map((step, idx) => `Etapa ${idx + 1}: ${step.title}\n\n${step.message}`).join('\n\n===\n\n');
  navigator.clipboard.writeText(text).then(() => toast('Sequência copiada!'));
}

function renderFollowups() {
  const search = (document.getElementById('search-fu')?.value || '').toLowerCase();
  const tierFilter = document.getElementById('fu-tier')?.value || '';
  const statusFilter = document.getElementById('fu-status')?.value || '';

  let items = CONTACTS.filter(c => c.email).map(c => {
    const state = getContactState(c.email);
    return { ...c, state };
  });

  if (tierFilter) items = items.filter(c => String(c.tier) === tierFilter);
  if (statusFilter) items = items.filter(c => c.state.status === statusFilter);
  if (search) items = items.filter(c =>
    c.nome.toLowerCase().includes(search) ||
    c.empresa.toLowerCase().includes(search) ||
    c.email.toLowerCase().includes(search) ||
    (c.state.current_step || '').toLowerCase().includes(search)
  );

  const today = new Date().toISOString().slice(0,10);
  const total = items.length;
  const t1 = items.filter(c => c.tier === 1).length;
  const t2 = items.filter(c => c.tier === 2).length;
  const t3 = items.filter(c => c.tier === 3).length;
  const t4 = items.filter(c => c.tier === 4).length;
  const t5 = items.filter(c => c.tier === 5).length;
  const em_sequencia = items.filter(c => ['etapa_1_enviada','aguardando_resposta','followup_1','followup_2','followup_3','em_conversa','reuniao_agendada','proposta_enviada','negociacao'].includes(c.state.status)).length;
  const aguardando = items.filter(c => c.state.status === 'aguardando_resposta').length;
  const atrasados = items.filter(c => c.state.next_followup_at && c.state.next_followup_at < today && !['convertido','sem_interesse','arquivado'].includes(c.state.status)).length;
  const hoje = items.filter(c => c.state.next_followup_at && c.state.next_followup_at === today && !['convertido','sem_interesse','arquivado'].includes(c.state.status)).length;
  const respostas = items.filter(c => c.state.replied).length;
  const oportunidades = items.filter(c => c.state.opportunity).length;
  const reunioes = items.filter(c => c.state.meeting).length;
  const conversoes = items.filter(c => c.state.conversion).length;

  const kpi = document.getElementById('followups-kpi');
  kpi.innerHTML = [
    { label:'Total', value: total, color:'var(--blue)'},
    { label:'T1', value: t1, color:'var(--green)'},
    { label:'T2', value: t2, color:'var(--blue)'},
    { label:'T3', value: t3, color:'var(--yellow)'},
    { label:'T4', value: t4, color:'var(--orange)'},
    { label:'T5', value: t5, color:'var(--red)'},
    { label:'Em sequência', value: em_sequencia, color:'var(--blue)'},
    { label:'Aguardando resposta', value: aguardando, color:'var(--yellow)'},
    { label:'Follow-ups hoje', value: hoje, color:'var(--green)'},
    { label:'Atrasados', value: atrasados, color:'var(--red)'},
    { label:'Respostas', value: respostas, color:'var(--green)'},
    { label:'Oportunidades', value: oportunidades, color:'var(--purple)'},
    { label:'Reuniões', value: reunioes, color:'var(--blue)'},
    { label:'Conversões', value: conversoes, color:'var(--green)'}
  ].map(k => `<div class="kpi-card"><div class="kpi-icon total" style="background:${k.color}22;color:${k.color}">📊</div><div><div class="kpi-num total" style="color:${k.color}">${k.value}</div><div class="kpi-label">${k.label}</div></div></div>`).join('');

  const tbody = document.getElementById('tbody-followups');
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="es-icon">📋</div><p>Nenhum follow-up encontrado.</p></div></td></tr>`;
    document.getElementById('fu-count').textContent = '—';
    return;
  }

  tbody.innerHTML = items.map(c => {
    const s = c.state;
    const next = s.next_followup_at || '—';
    const last = s.last_contact_at || '—';
    return `<tr>
      <td><div class="contact-name">${c.nome}</div><div class="contact-sub">${c.email}</div></td>
      <td><span class="nowrap">${c.empresa}</span></td>
      <td><span class="tier-badge ${tierClass(c.tier)}">${tierBadge(c.tier)}</span></td>
      <td><span class="fu-badge">${statusBadge(s.status)}</span></td>
      <td>${s.current_step || '—'}</td>
      <td>${last}</td>
      <td>${next}</td>
      <td>
        <div class="fu-actions">
          <button class="btn" onclick="openFollowupModal('${c.email}')">Registrar ação</button>
          <button class="btn" onclick="openContactTimeline('${c.email}')">Timeline</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('fu-count').textContent = `${total} contato${total !== 1 ? 's' : ''}`;
}

function openFollowupModal(email) {
  const contact = CONTACTS.find(c => c.email === email);

  const state = getContactState(email);
  const timeline = getTimeline()[email] || [];

  const existing = document.getElementById('fu-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'fu-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px;';
  modal.innerHTML = `<div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
      <div><div style="font-weight:700;font-size:14px;">Registrar ação — ${escapeHtml(contact.nome)}</div><div style="font-size:12px;color:var(--muted);">${escapeHtml(contact.empresa)} · ${escapeHtml(contact.cargo || '')}</div></div>
      <button class="btn" onclick="document.getElementById('fu-modal').remove()">Fechar</button>
    </div>

    <div class="timeline">
      ${timeline.slice(0,8).map(ev => `<div class="timeline-item"><div class="timeline-date">${ev.created_at ? new Date(ev.created_at).toLocaleString('pt-BR') : ''}</div><div>${escapeHtml(ev.type || '')} — ${escapeHtml(ev.step || '')}</div><div style="font-size:11px;color:var(--muted);">${escapeHtml(ev.result || '')}</div></div>`).join('') || '<div class="timeline-item"><div>Sem registros.</div></div>'}
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">
      <select id="fu-action" class="filter-select">
        <option value="">Tipo de ação</option>
        <option value="Enviar Etapa 1">Enviar Etapa 1</option>
        <option value="Enviar Follow-up 1">Enviar Follow-up 1</option>
        <option value="Enviar Follow-up 2">Enviar Follow-up 2</option>
        <option value="Enviar Follow-up 3">Enviar Follow-up 3</option>
        <option value="WhatsApp">WhatsApp</option>
        <option value="LinkedIn">LinkedIn</option>
        <option value="E-mail">E-mail</option>
        <option value="Ligação">Ligação</option>
        <option value="Resposta recebida">Resposta recebida</option>
        <option value="Reunião">Reunião</option>
        <option value="Proposta">Proposta</option>
        <option value="Outro">Outro</option>
      </select>
      <select id="fu-result" class="filter-select">
        <option value="">Resultado</option>
        <option value="Sem resposta">Sem resposta</option>
        <option value="Visualizou">Visualizou</option>
        <option value="Respondeu positivamente">Respondeu positivamente</option>
        <option value="Respondeu negativamente">Respondeu negativamente</option>
        <option value="Pediu informações">Pediu informações</option>
        <option value="Pediu orçamento">Pediu orçamento</option>
        <option value="Agendou reunião">Agendou reunião</option>
        <option value="Indicou outra pessoa">Indicou outra pessoa</option>
        <option value="Não é o momento">Não é o momento</option>
        <option value="Sem interesse">Sem interesse</option>
      </select>
      <input id="fu-next" type="date" class="filter-select" value="${nextDate(state.next_followup_at)}">
    </div>

    <textarea id="fu-note" placeholder="Observação" class="toolbar-search" style="margin-top:10px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);min-height:80px;"></textarea>

    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-green" onclick="saveFollowupAction('${email}')">Salvar</button>
      <button class="btn" onclick="document.getElementById('fu-modal').remove()">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function nextDate(value) {
  if (!value) return new Date().toISOString().slice(0,10);
  return value;
}

function saveFollowupAction(email) {
  const action = document.getElementById('fu-action')?.value || '';
  const result = document.getElementById('fu-result')?.value || '';
  const next = document.getElementById('fu-next')?.value || '';
  const note = document.getElementById('fu-note')?.value || '';
  if (!action && !result) { toast('Informe ação ou resultado'); return; }

  const state = getContactState(email);
  const now = new Date().toISOString().slice(0,10);

  const patch = { last_contact_at: now, notes: note };
  if (next) patch.next_followup_at = next;

  if (action) {
    patch.current_step = action;
    patch.attempts = (state.attempts || 0) + 1;
  }

  if (result) {
    patch.last_result = result;
    if (result === 'Respondeu positivamente') { patch.status = 'respondeu'; patch.replied = true; }
    else if (result === 'Respondeu negativamente' || result === 'Sem interesse') patch.status = 'sem_interesse';
    else if (result === 'Agendou reunião') { patch.status = 'reuniao_agendada'; patch.meeting = true; }
    else if (result === 'Pediu orçamento') { patch.status = 'proposta_enviada'; patch.opportunity = true; }
    else if (result === 'Indicou outra pessoa') patch.status = 'em_conversa';
    else if (result === 'Sem resposta' || result === 'Visualizou') patch.status = 'aguardando_resposta';
  }

  if (action && !result) patch.status = 'aguardando_resposta';

  updateContactState(email, patch);
  addTimelineEvent(email, { type: action || 'Atualização', step: patch.current_step || '', result, message: '', observation: note, next_action: next ? `Próximo follow-up: ${next}` : '' });
  toast('Ação registrada');
  document.getElementById('fu-modal')?.remove();
  renderFollowups();
}

  modal.id = 'fu-modal';

  modal.innerHTML = `<div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
      <div><div style="font-weight:700;font-size:14px;">Timeline — ${escapeHtml(contact.nome)}</div><div style="font-size:12px;color:var(--muted);">${escapeHtml(contact.empresa)} · ${escapeHtml(contact.cargo || '')}</div></div>
      <button class="btn" onclick="document.getElementById('fu-modal').remove()">Fechar</button>
    </div>

    <div class="timeline">
      ${timeline.map(ev => `<div class="timeline-item"><div class="timeline-date">${ev.created_at ? new Date(ev.created_at).toLocaleString('pt-BR') : ''}</div><div>${escapeHtml(ev.type || '')} — ${escapeHtml(ev.step || '')}</div><div style="font-size:11px;color:var(--muted);">${escapeHtml(ev.result || '')}</div><div style="font-size:11px;color:var(--muted);">${escapeHtml(ev.observation || '')}</div><div style="font-size:11px;color:var(--blue);">${escapeHtml(ev.next_action || '')}</div></div>`).join('') || '<div class="timeline-item"><div>Sem registros.</div></div>'}
    </div>
  </div>`;
  document.body.appendChild(modal);
}

// ── TAB REVISÃO ──
function renderRevisao() {
  const search = (document.getElementById('search-rev')?.value || '').toLowerCase();
  const revisao = CONTACTS.filter(c => {
    if (!needsReview(c)) return false;
    if (search && !(c.nome.toLowerCase().includes(search) || c.empresa.toLowerCase().includes(search))) return false;
    return true;
  });

  document.getElementById('rev-count').textContent = `${revisao.length} pendente${revisao.length !== 1 ? 's' : ''}`;

  if (revisao.length === 0) {
    document.getElementById('review-list').innerHTML = `<div class="empty-state"><div class="es-icon">✅</div><p>Nenhum contato pendente de revisão. Boa!</p></div>`;
    return;
  }

  document.getElementById('review-list').innerHTML = revisao.map(c => {
    const motivos = [];
    if (!c.cargo) motivos.push({ m: 'Sem cargo cadastrado', red: true });
    if (c.score === 0) motivos.push({ m: 'Score zero', red: true });
    if (c.tier <= 2 && c.score_composto < 30) motivos.push({ m: 'Tier alto com score baixo', red: false });

    return `<div class="review-card ${motivos.some(m => m.red) ? 'suspect' : ''}">
      <div class="review-info">
        <div class="review-name">${c.nome}</div>
        <div class="review-sub">${c.cargo || '<em>sem cargo</em>'} · ${c.empresa} · T${c.tier} · Score: ${c.score_composto}</div>
        ${motivos.map(m => `<span class="review-motivo ${m.red ? 'red' : ''}">${m.m}</span>`).join(' ')}
      </div>
      <div class="review-actions">
        <button class="rev-btn confirm" onclick="reviewAction('${c.email}','confirmar')">✓ Confirmar</button>
        <button class="rev-btn mark"    onclick="reviewAction('${c.email}','relevante')">⭐ Relevante</button>
        <button class="rev-btn discard" onclick="reviewAction('${c.email}','descartar')">✕ Descartar</button>
      </div>
    </div>`;
  }).join('');
}

function reviewAction(email, acao) {
  const msgs = { confirmar: 'Tier confirmado!', relevante: 'Marcado como relevante!', descartar: 'Contato descartado!' };
  toast(msgs[acao]);
  // Em produção: salvar ação no backend. Aqui apenas feedback visual.
}

// ── TAB FONTES ──
function renderFontes() {
  const totals = {};
  const tiers  = {};
  CONTACTS.forEach(c => {
    totals[c.fonte] = (totals[c.fonte] || 0) + 1;
    if (!tiers[c.fonte]) tiers[c.fonte] = {};
    tiers[c.fonte][c.tier] = (tiers[c.fonte][c.tier] || 0) + 1;
  });

  const total = CONTACTS.length;
  const icons = {
    LinkedIn: '💼', WhatsApp: '💬', Agencias_SP: '🏢', Escolas_Jac: '🏫',
    Controle_Leads: '📋', Captacao_Recursos: '💰'
  };

  const sorted = Object.entries(totals).sort((a,b) => b[1] - a[1]);

  document.getElementById('fonte-grid').innerHTML = sorted.map(([f, q]) => {
    const pct = ((q / total) * 100).toFixed(1);
    return `<div class="fonte-card ${activeSource === f ? 'active-source' : ''}" onclick="drillFonte('${f}')">
      <div class="fonte-icon">${icons[f] || '📁'}</div>
      <div class="fonte-name">${f.replace(/_/g,' ')}</div>
      <div class="fonte-count">${q}</div>
      <div class="fonte-pct">${pct}% do total</div>
      <div class="fonte-bar"><div class="fonte-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function drillFonte(fonte) {
  activeSource = activeSource === fonte ? null : fonte;
  renderFontes();

  const detail = document.getElementById('fonte-detail');
  if (!activeSource) { detail.className = 'fonte-detail'; return; }

  const contatos = CONTACTS.filter(c => c.fonte === fonte).sort((a,b) => b.score_composto - a.score_composto);
  document.getElementById('fonte-detail-title').textContent = `${fonte.replace(/_/g,' ')} — ${contatos.length} contatos`;

  document.getElementById('tbody-fonte').innerHTML = contatos.map(c => `
    <tr>
      <td><div class="contact-name">${c.nome}</div></td>
      <td style="font-size:12px">${c.cargo || '—'}</td>
      <td style="font-size:12px">${c.empresa}</td>
      <td><span class="tier-badge ${tierClass(c.tier)}">T${c.tier}</span></td>
      <td><span class="score-pill ${scoreClass(c.score_composto)}">${c.score_composto}</span></td>
      <td><span class="prio-badge ${prioClass(c.prioridade)}">${c.prioridade}</span></td>
    </tr>`).join('');

  detail.className = 'fonte-detail visible';
}

// ── TAB DOMÍNIOS ──
function renderDominios() {
  const min = parseInt(document.getElementById('dom-min').value) || 1;
  const search = (document.getElementById('dom-search')?.value || '').toLowerCase();

  const domMap = {};
  CONTACTS.forEach(c => {
    if (!c.email) return;
    const parts = c.email.split('@');
    if (parts.length < 2) return;
    const dom = parts[1].toLowerCase();
    if (!domMap[dom]) domMap[dom] = { total: 0, tiers: {} };
    domMap[dom].total++;
    domMap[dom].tiers[c.tier] = (domMap[dom].tiers[c.tier] || 0) + 1;
  });

  let doms = Object.entries(domMap).filter(([d, v]) => v.total >= min);
  if (search) doms = doms.filter(([d]) => d.includes(search));
  doms.sort((a,b) => b[1].total - a[1].total);

  document.getElementById('dom-count').textContent = `${doms.length} domínio${doms.length !== 1 ? 's' : ''}`;

  if (doms.length === 0) {
    document.getElementById('tbody-dom').innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="es-icon">🌐</div><p>Nenhum domínio encontrado.</p></div></td></tr>`;
    return;
  }

  const tierColors = { 1:'var(--tier1)',2:'var(--tier2)',3:'var(--tier3)',4:'var(--tier4)',5:'var(--tier5)',6:'var(--tier6)' };

  document.getElementById('tbody-dom').innerHTML = doms.map(([d, v]) => {
    const principalTier = Object.entries(v.tiers).sort((a,b) => b[1]-a[1])[0][0];
    const bars = Object.entries(v.tiers).map(([t, q]) => {
      const w = Math.max(8, Math.round((q / v.total) * 80));
      return `<div class="tier-dot" style="width:${w}px;background:${tierColors[t]}" title="T${t}: ${q}"></div>`;
    }).join('');

    return `<tr>
      <td style="font-family:var(--mono);font-size:12px;color:var(--blue)">${d}</td>
      <td style="font-size:13px;font-weight:700">${v.total}</td>
      <td><div class="tier-dist">${bars}</div></td>
      <td><span class="tier-badge ${tierClass(principalTier)}">T${principalTier}</span></td>
    </tr>`;
  }).join('');
}
